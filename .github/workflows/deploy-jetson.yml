# main에 서버 코드·화면이 push되면 Jetson(self-hosted runner, 라벨 jetson)에서 pull -> 테스트 -> 빌드 -> 재시작.
# 실제 자동매매 서버라 코스닥 장중(평일 08:50~15:40 KST)에는 기다렸다가 장 마감 뒤에 배포합니다.
# 기다리는 중에 새 push가 오면 이전 실행은 취소되고 마지막 것만 배포합니다.
# 'Run workflow' 버튼(now 체크)으로 장중에도 바로 배포할 수 있습니다.
# 공개 저장소라 pull_request로는 절대 실행하지 않습니다 (외부 PR 코드가 Jetson에서 돌지 않게).
name: Jetson 배포

on:
  push:
    branches: [main]
    paths:
      - "java-app/**"
      - "spring-app/**"
      - "*.html"
      - "*.js"
      - "docs/**"
      - "deploy/jetson/**"
      - ".github/workflows/deploy-jetson.yml"
  workflow_dispatch:
    inputs:
      now:
        description: "장중이어도 바로 배포"
        type: boolean
        default: false

concurrency:
  group: jetson-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, jetson]
    timeout-minutes: 600
    steps:
      - name: 장중이면 장 마감(15:40)까지 기다림
        if: ${{ !inputs.now }}
        run: |
          now=$(TZ=Asia/Seoul date +%s)
          dow=$(TZ=Asia/Seoul date +%u)
          open=$(TZ=Asia/Seoul date -d "08:50" +%s)
          close=$(TZ=Asia/Seoul date -d "15:40" +%s)
          if [ "$dow" -le 5 ] && [ "$now" -ge "$open" ] && [ "$now" -lt "$close" ]; then
            echo "코스닥 장중이라 $(( (close - now) / 60 ))분 기다렸다가 배포합니다."
            sleep $((close - now))
          fi

      - name: git pull
        run: git -C /home/jetson/yang/MyProject_Yang_01 pull --ff-only origin main

      - name: 테스트 · 빌드 · 재시작
        run: sh /home/jetson/yang/MyProject_Yang_01/deploy/jetson/deploy.sh
