# 평일 장 마감 뒤(16:00 KST) Jetson의 kosdaq.db로 이번 달 에러 예산을 계산해 Job Summary에 남깁니다 (README 'SLO / SLI').
# 예산을 다 쓰면 실패 → GitHub가 실패 메일을 보냄. 자동매매를 끄고 원인부터 고칩니다.
name: 에러 예산

on:
  schedule:
    - cron: "0 7 * * 1-5"   # 16:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    runs-on: [self-hosted, jetson]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/jetson
      - run: python3 deploy/jetson/error_budget.py --max 100
