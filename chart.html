<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>종목 차트</title>
<!--
  종목 검색 + 일봉 차트. dividends_web.py가 /chart 로 이 파일을 제공합니다.
  검색은 /api/search?q= (국내 이름·종목번호, 미국 티커), 차트는 /api/chart?market=kr|us&code= (최근 약 1년 일봉).
  /chart?market=kr&code=005930 처럼 주소로 바로 열 수 있고, 주소에 종목이 없으면 마지막으로 본 종목을 엽니다.
  서버에 저장된 그 종목의 마지막 차트(?cached=1)를 먼저 그리고 KB 응답이 오면 교체합니다.
-->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.04);
  --series-1: #2a78d6; --select: rgba(42,120,214,0.08); --bad: #d03b3b;
  --up: #e34948; --down: #2a78d6;
  --ma5: #e0912b; --ma20: #1f8a4c; --ma60: #8a5cd6; --ma120: #9a6b3f; --bb: #0e9aa7;
  --rsi: #c2477a; --macd: #2f6fd0; --signal: #d9603b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
    --series-1: #3987e5; --select: rgba(57,135,229,0.14); --bad: #e66767;
    --up: #e66767; --down: #3987e5;
    --ma5: #f0a646; --ma20: #3fb36d; --ma60: #a685e8; --ma120: #c08c5c; --bb: #2cc0cc;
  --rsi: #e2709d; --macd: #5b93ea; --signal: #ef8358;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
  --series-1: #3987e5; --select: rgba(57,135,229,0.14); --bad: #e66767;
  --up: #e66767; --down: #3987e5;
  --ma5: #f0a646; --ma20: #3fb36d; --ma60: #a685e8; --ma120: #c08c5c; --bb: #2cc0cc;
  --rsi: #e2709d; --macd: #5b93ea; --signal: #ef8358;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
.wrap { max-width: 1160px; margin: 0 auto; padding: 24px 16px 48px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
.nav { display: flex; gap: 4px; margin: 0 0 10px -10px; font-size: 14px; }
.nav a { color: var(--ink-2); text-decoration: none; padding: 4px 10px; border-radius: 8px; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 650; background: var(--hover); }
.nav a.home { color: var(--muted); }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select, button, input {
  font: inherit; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--ink); cursor: pointer;
}
input { cursor: text; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--select); color: var(--series-1); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card + .card { margin-top: 12px; }
.card h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
.sub { color: var(--muted); font-size: 12px; margin: 0; }
.stale { color: var(--series-1); }
.stale.bad { color: var(--bad); }

.search { position: relative; }
.search input { width: 100%; padding: 10px 14px; font-size: 16px; }
.results { list-style: none; margin: 8px 0 0; padding: 0; max-height: 360px; overflow: auto; }
.results button { width: 100%; display: flex; gap: 10px; align-items: baseline; text-align: left; border: 0; border-radius: 8px; background: none; padding: 8px 10px; }
.results button:hover, .results button:focus-visible { background: var(--hover); }
.results .code { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.recent { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.recent .label { color: var(--muted); font-size: 12px; margin-right: 2px; }
.recent button { padding: 3px 10px; font-size: 13px; border-radius: 999px; }
.recent button:hover { background: var(--hover); }
.recent button[aria-current="true"] { background: var(--select); color: var(--series-1); border-color: transparent; font-weight: 600; }
.recent .code { color: var(--muted); font-size: 11px; margin-left: 4px; }
.tag { font-size: 11px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; margin-left: auto; white-space: nowrap; }

.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 12px; }
.price { font-size: 32px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.chg { font-size: 15px; font-weight: 600; margin-left: 8px; }
.up { color: var(--up); } .down { color: var(--down); }
/* 기술적 시그널: 매수 쪽 빨강, 매도 쪽 파랑 (국내 등락 색과 같음) */
.sig { display: inline-block; font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 999px; margin: 2px 4px 2px 0; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.sig.buy { color: var(--up); border-color: color-mix(in srgb, var(--up) 45%, transparent); background: color-mix(in srgb, var(--up) 8%, transparent); }
.sig.sell { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, transparent); background: color-mix(in srgb, var(--down) 8%, transparent); }
.sigs { margin-top: 6px; }
.sig-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.sig-table th { color: var(--muted); font-weight: 500; font-size: 12px; text-align: left; padding: 6px; }
.sig-table td { padding: 8px 6px; border-top: 1px solid var(--grid); vertical-align: top; }
.sig-table tbody tr { cursor: pointer; }
.sig-table tbody tr:hover { background: var(--hover); }
.sig-table .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sig-table .code { color: var(--muted); font-size: 11px; margin-left: 4px; }
.sig-table .tag { margin-left: 4px; }
@media (max-width: 600px) { .sig-table .hide-sm { display: none; } }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 16px; margin-top: 12px; font-variant-numeric: tabular-nums; }
.stats div span { display: block; color: var(--muted); font-size: 12px; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .price { font-size: 26px; } }

#plot { position: relative; }
#plot svg { display: block; width: 100%; touch-action: pan-y; }
#plot text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.inds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -4px 0 8px; font-size: 12px; }
.inds .label { color: var(--muted); margin-right: 2px; }
.inds label { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 4px; border-radius: 6px; cursor: pointer; color: var(--ink-2); user-select: none; }
.inds label:hover { background: var(--hover); }
.inds input { margin: 0; width: 14px; height: 14px; cursor: pointer; }
.inds label i { width: 12px; height: 3px; border-radius: 2px; }
.tip .ind { margin-right: 8px; white-space: nowrap; }
.tip { position: absolute; top: 4px; left: 8px; font-size: 12px; color: var(--ink-2); background: var(--surface); padding: 2px 6px; border-radius: 6px; pointer-events: none; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 32px 0; text-align: center; }
.error { border: 1px solid var(--bad); border-radius: 12px; padding: 16px; }
.loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 60px 0; color: var(--ink-2); }
.spinner { width: 20px; height: 20px; border: 2px solid var(--grid); border-top-color: var(--series-1); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.note { color: var(--muted); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <nav class="nav"><a href="./" class="home">KB OpenAPI</a><a href="heatmap">히트맵</a><a href="me">내정보</a><a href="chart" aria-current="page">차트</a><a href="volume">거래량</a><a href="trader">자동매매</a></nav>
      <h1>종목 차트</h1>
    </div>
    <button id="theme" aria-label="테마 전환">◐</button>
  </header>

  <section class="card">
    <div class="search">
      <input id="q" type="search" placeholder="종목이름 · 종목번호 · 티커 (예: 삼성전자, 005930, AAPL)" autocomplete="off" aria-label="종목 검색" autofocus>
      <ul class="results" id="results"></ul>
    </div>
    <div class="recent" id="recent" hidden></div>
  </section>

  <section class="card" id="chart-card" hidden>
    <div id="chart-body"></div>
  </section>

  <section class="card" id="sig-card">
    <h2>기술적 시그널</h2>
    <p class="sub" id="sig-status">보유 종목(ETF 제외)과 최근 검색 종목의 최근 일봉으로 계산합니다.</p>
    <div id="sig-body"></div>
  </section>
  <p class="note">국내는 KB OpenAPI 상장 종목 목록(IVS10920)에서 이름·종목번호로, 미국은 티커로 찾습니다(나스닥·뉴욕·아멕스). 일봉은 국내 IVS11560, 미국 GSC10060(15분 지연)으로 최근 약 1년을 받습니다.</p>
</div>

<script src="signals.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 0) => n == null || isNaN(n) ? "—" : Number(n).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });
const compact = n => n >= 1e12 ? fmt(n / 1e12, 1) + "조" : n >= 1e8 ? fmt(n / 1e8, 0) + "억" : n >= 1e4 ? fmt(n / 1e4, 0) + "만" : fmt(n);
const day = d => `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)}`;
const PERIODS = { "1M": 21, "3M": 63, "6M": 126, "1Y": 9999 };
const S = { data: null, period: "6M", hover: null, stale: "" };  // stale: "" | "loading" | 새로 조회 실패 메시지

// ---------------------------------------------------------------- 보조지표 (계산은 signals.js: MAS, BB, RSI_N, MACD, sma, ema, rsi, macd, bollinger)
const IND = { ma5: true, ma20: true, ma60: true, ma120: false, bb: false, rsi: false, macd: false };  // 시작할 때 서버의 chart_settings.json 값으로 바뀜

// 차트 설정(기간, 지표 체크)은 서버의 chart_settings.json에 저장해 다음에 열 때도 그대로 씁니다
async function loadSettings() {
  try {
    const s = await getJson("api/settings");
    if (s.period in PERIODS) S.period = s.period;
    for (const k in IND) if (typeof s[k] === "boolean") IND[k] = s[k];
  } catch { /* 저장된 설정을 못 읽어도 기본값으로 차트는 그림 */ }
}
function saveSettings() {
  fetch("api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ period: S.period, ...IND }) })
    .catch(() => {});  // 저장 실패해도 화면은 그대로 (다음에 열 때 이전 설정)
}


async function getJson(url) {
  const res = await fetch(url, { cache: "no-store" });
  const d = await res.json().catch(() => ({ error: `서버 응답이 JSON이 아닙니다 (HTTP ${res.status})` }));
  if (!res.ok || d.error) throw new Error(d.error || `HTTP ${res.status}`);
  return d;
}

// ---------------------------------------------------------------- 검색
let searchSeq = 0, timer;
$("#q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 250); });
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter") { clearTimeout(timer); search(true); }
  if (e.key === "ArrowDown") { e.preventDefault(); $("#results button")?.focus(); }
});
$("#results").addEventListener("keydown", e => {
  const bs = [...document.querySelectorAll("#results button")], i = bs.indexOf(document.activeElement);
  if (e.key === "ArrowDown") { e.preventDefault(); bs[i + 1]?.focus(); }
  if (e.key === "ArrowUp") { e.preventDefault(); (bs[i - 1] || $("#q")).focus(); }
});

async function search(openFirst = false) {
  const q = $("#q").value.trim(), seq = ++searchSeq;
  if (!q) { $("#results").innerHTML = ""; return; }
  $("#results").innerHTML = `<li class="sub" style="padding:8px 10px">검색 중…</li>`;
  try {
    const d = await getJson(`api/search?q=${encodeURIComponent(q)}`);
    if (seq !== searchSeq) return;  // 더 늦게 친 검색어의 결과만 보여 줌
    if (!d.results.length) { $("#results").innerHTML = `<li class="sub" style="padding:8px 10px">검색 결과가 없습니다.</li>`; return; }
    $("#results").innerHTML = d.results.map((s, i) => `<li><button data-i="${i}">
      <b>${esc(s.name)}</b><span class="code">${esc(s.code)}</span>
      <span class="tag">${s.market === "kr" ? "국내" : "미국" + (s.exchange ? " · " + esc(s.exchange) : "")}</span></button></li>`).join("");
    document.querySelectorAll("#results button").forEach(b => b.onclick = () => pick(d.results[b.dataset.i]));
    if (openFirst) pick(d.results[0]);
  } catch (err) {
    if (seq === searchSeq) $("#results").innerHTML = `<li class="error">${esc(err.message)}</li>`;
  }
}

// ---------------------------------------------------------------- 기술적 시그널 (signalsOf, sigBadges, sigScore는 signals.js)

// 보유 종목(ETF 제외) + 최근 검색. 저장된 차트(?cached=1)로 먼저 그리고 KB에서 하나씩 새로 받아 교체.
// recent=0: 시그널 계산용 조회는 최근 검색에 남기지 않음
const SIG = { rows: [], seq: 0 };
async function loadSignals() {
  const seq = ++SIG.seq;
  const getHoldings = () => getJson("api/holdings?cached=1").catch(() => getJson("api/holdings"));
  const [holds, recents] = await Promise.all([
    getHoldings().then(d => d.stocks).catch(() => []),
    getJson("api/recent").then(d => d.items).catch(() => [])]);
  const etf = new Set(holds.filter(s => s.etf).map(s => s.code));
  const rows = new Map();
  for (const s of holds.filter(s => !s.etf)) {
    const market = s.market === "국내" ? "kr" : "us";
    rows.set(`${market}:${s.code}`, { market, code: s.code, exchange: "", name: s.name, held: true });
  }
  for (const s of recents.filter(s => !etf.has(s.code))) {
    const k = `${s.market}:${s.code}`;
    if (rows.has(k)) rows.get(k).recent = true; else rows.set(k, { ...s, recent: true });
  }
  if (seq !== SIG.seq) return;
  SIG.rows = [...rows.values()];
  if (!SIG.rows.length) { $("#sig-body").innerHTML = `<div class="empty">보유 종목(ETF 제외)과 최근 검색이 없습니다.</div>`; return; }
  renderSignals();
  const url = r => `api/chart?${new URLSearchParams({ market: r.market, code: r.code, ...(r.exchange && { exchange: r.exchange }), recent: "0" })}`;
  await Promise.all(SIG.rows.map(r => getJson(url(r) + "&cached=1")
    .then(d => { if (seq === SIG.seq && !r.fresh) { r.data = d; renderSignals(); } }).catch(() => {})));
  // KB 새 조회는 2개씩 (한꺼번에 부르지 않게)
  const queue = [...SIG.rows];
  const worker = async () => {
    for (let r; (r = queue.shift());) {
      try { r.data = await getJson(url(r)); r.fresh = true; r.error = ""; }
      catch (err) { r.error = err.message; }
      if (seq !== SIG.seq) return;
      renderSignals();
    }
  };
  await Promise.all([worker(), worker()]);
  if (seq === SIG.seq) $("#sig-status").textContent = `보유 종목(ETF 제외)과 최근 검색 종목 ${SIG.rows.length}개 · 마지막 거래일 기준, 교차는 최근 ${SIG_DAYS}거래일 안 · 투자 판단의 참고용입니다`;
}

function renderSignals() {
  const left = SIG.rows.filter(r => !r.fresh && !r.error).length;
  if (left) $("#sig-status").textContent = `KB에서 일봉을 새로 받는 중… (${SIG.rows.length - left}/${SIG.rows.length})`;
  $("#sig-body").innerHTML = `<table class="sig-table">
    <thead><tr><th>종목</th><th class="num hide-sm">종가</th><th>시그널</th><th class="num">종합</th></tr></thead>
    <tbody>${SIG.rows.map((r, i) => {
      const cs = r.data?.candles || [], c = cs.at(-1), p = cs.at(-2), list = cs.length ? signalsOf(cs) : null;
      const dp = r.market === "us" ? 2 : 0, pct = c && p ? (c.c / p.c - 1) * 100 : null;
      return `<tr data-i="${i}" title="차트 열기">
        <td><b>${esc(r.data?.name || r.name)}</b><span class="code">${esc(r.code)}</span>
          ${r.held ? `<span class="tag">보유</span>` : ""}${r.recent ? `<span class="tag">최근</span>` : ""}</td>
        <td class="num hide-sm">${c ? `${r.market === "us" ? "$" : ""}${fmt(c.c, dp)}<br><span class="${pct > 0 ? "up" : pct < 0 ? "down" : ""}">${pct > 0 ? "+" : ""}${fmt(pct, 2)}%</span>` : "—"}</td>
        <td>${list ? sigBadges(list) : r.error ? `<span class="sub">${esc(r.error)}</span>` : `<span class="sub">불러오는 중…</span>`}</td>
        <td class="num">${list ? sigScore(list) : ""}</td></tr>`;
    }).join("")}</tbody></table>`;
  document.querySelectorAll(".sig-table tbody tr").forEach(tr => tr.onclick = () => {
    const r = SIG.rows[tr.dataset.i];
    pick({ market: r.market, code: r.code, exchange: r.data?.exchange || r.exchange });
    scrollTo({ top: 0, behavior: "smooth" });
  });
}

// ---------------------------------------------------------------- 차트 조회
function pick(s, push = true) {
  $("#results").innerHTML = "";
  const params = new URLSearchParams({ market: s.market, code: s.code });
  if (s.exchange) params.set("exchange", s.exchange);
  history[push ? "pushState" : "replaceState"](null, "", `?${params}`);
  load(params);
}

let loadSeq = 0;
async function load(params) {
  const seq = ++loadSeq;
  $("#chart-card").hidden = false;
  $("#chart-body").innerHTML = `<div class="loading"><div class="spinner"></div>${esc(params.get("code"))} 일봉을 불러오고 있습니다.</div>`;
  const show = (d, stale) => {
    S.data = d; S.hover = null; S.stale = stale;
    document.title = `${d.name} 차트`;
    render();
  };
  // 서버(last_api/chart_*.txt)에 저장된 이 종목의 마지막 차트를 먼저 그리고, KB 응답이 오면 교체
  let done = false, shown = false;
  getJson(`api/chart?${params}&cached=1`)
    .then(d => { if (!done && seq === loadSeq) { shown = true; show(d, "loading"); } })
    .catch(() => {});  // 저장된 차트가 없으면 로딩 표시 그대로
  try {
    const d = await getJson(`api/chart?${params}`);
    done = true;
    if (seq !== loadSeq) return;
    show(d, "");
    loadRecent();  // 서버가 방금 연 종목을 최근 검색 맨 앞에 저장함
  } catch (err) {
    done = true;
    if (seq !== loadSeq) return;
    if (shown) { S.stale = err.message; render(); }
    else $("#chart-body").innerHTML = `<div class="error"><b>차트를 불러오지 못했습니다</b><br>${esc(err.message)}</div>`;
  }
}

// ---------------------------------------------------------------- 최근 검색 (서버의 recent_searches.txt, 최대 10개)
async function loadRecent() {
  try {
    const { items } = await getJson("api/recent");
    const box = $("#recent");
    box.hidden = !items.length;
    box.innerHTML = `<span class="label">최근 검색</span>` + items.map((s, i) => `<button data-i="${i}"
      aria-current="${S.data?.market === s.market && S.data?.code === s.code}" title="${s.market === "kr" ? "국내" : "미국"} ${esc(s.exchange)}">${esc(s.name)}<span class="code">${esc(s.code)}</span></button>`).join("");
    box.querySelectorAll("button").forEach(b => b.onclick = () => pick(items[b.dataset.i]));
    return items;
  } catch { return []; /* 최근 검색이 없어도 검색·차트는 그대로 */ }
}

function render() {
  const d = S.data, all = d.candles;
  if (!all.length) { $("#chart-body").innerHTML = `<div class="empty">일봉 데이터가 없습니다.</div>`; return; }
  const dp = d.currency === "USD" ? 2 : 0, unit = d.currency === "USD" ? "$" : "";
  const cs = all.slice(-PERIODS[S.period]);
  const last = all[all.length - 1], prev = all[all.length - 2];
  const chg = prev ? last.c - prev.c : 0, pct = prev ? chg / prev.c * 100 : 0;
  const ret = (last.c / cs[0].c - 1) * 100;
  const cls = v => v > 0 ? "up" : v < 0 ? "down" : "";
  const sign = v => v > 0 ? "+" : "";
  $("#chart-body").innerHTML = `
    <div class="head">
      <div>
        <h2>${esc(d.name)} <span class="sub">${esc(d.code)} · ${esc(d.exchange)} · ${day(last.d)} 기준${S.stale === "loading" ? ` <span class="stale">· 이전 조회 값 · 새로 불러오는 중…</span>`
          : S.stale ? ` <span class="stale bad">· 새로 조회하지 못해 이전 값을 보여 줍니다: ${esc(S.stale)}</span>` : ""}</span></h2>
        <div><span class="price">${unit}${fmt(last.c, dp)}</span>
          <span class="chg ${cls(chg)}">${sign(chg)}${fmt(chg, dp)} (${sign(pct)}${fmt(pct, 2)}%)</span></div>
        <div class="sigs">${sigBadges(signalsOf(all))}</div>
      </div>
      <div class="seg" role="group" aria-label="기간">${Object.keys(PERIODS).map(p => `<button data-p="${p}" aria-pressed="${p === S.period}">${p}</button>`).join("")}</div>
    </div>
    <div class="inds" role="group" aria-label="보조지표"><span class="label">이평선</span>
      ${MAS.map(n => `<label><input type="checkbox" data-ind="ma${n}" ${IND["ma" + n] ? "checked" : ""}><i style="background:var(--ma${n})"></i>${n}</label>`).join("")}
      <span class="label" style="margin-left:6px">밴드</span>
      <label><input type="checkbox" data-ind="bb" ${IND.bb ? "checked" : ""}><i style="background:var(--bb)"></i>볼린저 ${BB.n},${BB.k}</label>
      <span class="label" style="margin-left:6px">보조</span>
      <label><input type="checkbox" data-ind="rsi" ${IND.rsi ? "checked" : ""}><i style="background:var(--rsi)"></i>RSI ${RSI_N}</label>
      <label><input type="checkbox" data-ind="macd" ${IND.macd ? "checked" : ""}><i style="background:var(--macd)"></i>MACD ${MACD.fast},${MACD.slow},${MACD.signal}</label>
    </div>
    <div id="plot"><div class="tip" id="tip"></div></div>
    <div class="stats">
      <div><span>기간 수익률</span><b class="${cls(ret)}">${sign(ret)}${fmt(ret, 2)}%</b></div>
      <div><span>기간 최고</span>${unit}${fmt(Math.max(...cs.map(c => c.h)), dp)}</div>
      <div><span>기간 최저</span>${unit}${fmt(Math.min(...cs.map(c => c.l)), dp)}</div>
      <div><span>최근 거래대금</span>${unit}${compact(last.amt)}${d.currency === "USD" ? "" : "원"}</div>
    </div>`;
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { S.period = b.dataset.p; S.hover = null; saveSettings(); render(); });
  document.querySelectorAll(".inds input").forEach(c => c.onchange = () => {
    IND[c.dataset.ind] = c.checked;
    saveSettings();
    render();
    $(`.inds input[data-ind="${c.dataset.ind}"]`).focus();  // 다시 그려도 키보드 위치 유지
  });
  // 지표는 1년 전체로 계산한 뒤 보이는 구간만 잘라 씁니다 (짧은 기간에서도 120일선이 왼쪽 끝부터 나옴)
  const closes = all.map(c => c.c), from = all.length - cs.length;
  const lines = MAS.filter(n => IND["ma" + n]).map(n => ({ key: "ma" + n, label: `MA${n}`, vs: sma(closes, n).slice(from) }));
  const band = IND.bb ? bollinger(closes, BB.n, BB.k).slice(from) : null;
  const osc = { rsi: IND.rsi && rsi(closes, RSI_N).slice(from), macd: IND.macd && macd(closes, MACD.fast, MACD.slow, MACD.signal).slice(from) };
  draw(cs, dp, unit, lines, band, osc);
}

// ---------------------------------------------------------------- 그리기 (SVG 캔들 + 거래량)
function draw(cs, dp, unit, lines = [], band = null, osc = {}) {
  const box = $("#plot"), W = box.clientWidth, H = Math.max(260, Math.min(420, W * 0.5));
  // 보조지표(RSI, MACD)는 거래량 아래에 칸을 하나씩 붙여 같은 가로축으로 그림
  const panels = ["rsi", "macd"].filter(k => osc[k]), PH = 84, PG = 16, total = H + panels.length * (PH + PG);
  const hasInd = lines.length || band || panels.length;
  const padL = 8, padR = 64, padT = hasInd ? 46 : 28, volH = H * 0.18, gap = 8, priceH = H - padT - volH - gap - 20;
  const n = cs.length, step = (W - padL - padR) / n, bw = Math.max(1, Math.min(10, step * 0.7));
  // 세로 범위에 지표 값도 포함 (밴드·이평선이 잘리지 않게)
  const extra = [...lines.flatMap(l => l.vs), ...(band || []).flatMap(b => b ? [b.up, b.lo] : [])].filter(v => v != null);
  const hi = Math.max(...cs.map(c => c.h), ...extra), lo = Math.min(...cs.map(c => c.l), ...extra), span = hi - lo || hi || 1;
  const y = v => padT + (hi - v) / span * priceH;
  const vmax = Math.max(...cs.map(c => c.v)) || 1;
  const vy = v => H - 20 - v / vmax * volH;
  const x = i => padL + step * (i + 0.5);
  const col = c => c.c > c.o ? "var(--up)" : c.c < c.o ? "var(--down)" : "var(--muted)";

  const ticks = Array.from({ length: 5 }, (_, i) => lo + span * i / 4);
  const months = cs.map((c, i) => [c, i]).filter(([c], i) => i && c.d.slice(4, 6) !== cs[i - 1].d.slice(4, 6));
  const every = Math.ceil(months.length / Math.max(1, Math.floor(W / 70)));
  let svg = `<svg viewBox="0 0 ${W} ${total}" height="${total}" role="img" aria-label="일봉 차트">`;
  svg += ticks.map(t => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>
    <text x="${W - padR + 6}" y="${y(t) + 4}">${fmt(t, dp)}</text>`).join("");
  svg += months.filter((_, k) => k % every === 0).map(([c, i]) => `<line x1="${x(i)}" x2="${x(i)}" y1="${padT}" y2="${H - 20}" stroke="var(--grid)" stroke-dasharray="2 3"/>
    <text x="${x(i)}" y="${H - 4}" text-anchor="middle">${c.d.slice(4, 6) === "01" ? c.d.slice(0, 4) : +c.d.slice(4, 6) + "월"}</text>`).join("");
  // 값이 없는(null) 날은 건너뛰어 끊긴 선으로
  const path = (vs, fy = y) => vs.map((v, i) => v == null ? "" : `${i && vs[i - 1] != null ? "L" : "M"}${x(i).toFixed(1)} ${fy(v).toFixed(1)}`).join("");
  if (band) {
    const ok = band.map((b, i) => [b, i]).filter(([b]) => b);
    if (ok.length) svg += `<path d="M${ok.map(([b, i]) => `${x(i).toFixed(1)} ${y(b.up).toFixed(1)}`).join("L")}L${ok.reverse().map(([b, i]) => `${x(i).toFixed(1)} ${y(b.lo).toFixed(1)}`).join("L")}Z" fill="var(--bb)" opacity=".08"/>`;
    svg += ["up", "lo"].map(k => `<path d="${path(band.map(b => b && b[k]))}" fill="none" stroke="var(--bb)" stroke-width="1.2"/>`).join("")
      + `<path d="${path(band.map(b => b && b.mid))}" fill="none" stroke="var(--bb)" stroke-width="1" stroke-dasharray="4 3"/>`;
  }
  svg += cs.map((c, i) => `<line x1="${x(i)}" x2="${x(i)}" y1="${y(c.h)}" y2="${y(c.l)}" stroke="${col(c)}"/>
    <rect x="${x(i) - bw / 2}" y="${Math.min(y(c.o), y(c.c))}" width="${bw}" height="${Math.max(1, Math.abs(y(c.o) - y(c.c)))}" fill="${col(c)}"/>
    <rect x="${x(i) - bw / 2}" y="${vy(c.v)}" width="${bw}" height="${H - 20 - vy(c.v)}" fill="${col(c)}" opacity=".45"/>`).join("");
  svg += lines.map(l => `<path d="${path(l.vs)}" fill="none" stroke="var(--${l.key})" stroke-width="1.5" stroke-linejoin="round"/>`).join("");
  const last = cs[n - 1];
  svg += `<line x1="${padL}" x2="${W - padR}" y1="${y(last.c)}" y2="${y(last.c)}" stroke="${col(last)}" stroke-dasharray="3 3"/>
    <rect x="${W - padR + 2}" y="${y(last.c) - 9}" width="${padR - 4}" height="18" rx="4" fill="${col(last)}"/>
    <text x="${W - padR + 6}" y="${y(last.c) + 4}" style="fill:#fff">${fmt(last.c, dp)}</text>`;
  panels.forEach((k, p) => {
    const top = H + PG + p * (PH + PG), right = W - padR;
    const [lo, hi] = k === "rsi" ? [0, 100] : (m => [-m, m])(Math.max(...osc.macd.flatMap(v => v ? [v.m, v.s, v.h] : []).filter(v => v != null).map(Math.abs)) || 1);
    const py = v => top + (hi - v) / (hi - lo) * PH;
    const tick = (v, label, dash) => `<line x1="${padL}" x2="${right}" y1="${py(v)}" y2="${py(v)}" stroke="var(--grid)" ${dash ? 'stroke-dasharray="3 3"' : ""}/>
      <text x="${right + 6}" y="${py(v) + 4}">${label}</text>`;
    svg += `<rect x="${padL}" y="${top}" width="${right - padL}" height="${PH}" fill="none" stroke="var(--grid)"/>`;
    if (k === "rsi") {
      svg += `<rect x="${padL}" y="${py(70)}" width="${right - padL}" height="${py(30) - py(70)}" fill="var(--rsi)" opacity=".06"/>`
        + tick(70, "70", true) + tick(30, "30", true)
        + `<path d="${path(osc.rsi, py)}" fill="none" stroke="var(--rsi)" stroke-width="1.5"/>`
        + `<text x="${padL + 6}" y="${top + 13}" style="fill:var(--rsi)">RSI ${RSI_N}</text>`;
    } else {
      const m = osc.macd;
      svg += tick(0, "0")
        + m.map((v, i) => v?.h == null ? "" : `<rect x="${x(i) - bw / 2}" y="${Math.min(py(0), py(v.h))}" width="${bw}" height="${Math.max(0.5, Math.abs(py(v.h) - py(0)))}" fill="${v.h >= 0 ? "var(--up)" : "var(--down)"}" opacity=".45"/>`).join("")
        + `<path d="${path(m.map(v => v && v.m), py)}" fill="none" stroke="var(--macd)" stroke-width="1.5"/>`
        + `<path d="${path(m.map(v => v && v.s), py)}" fill="none" stroke="var(--signal)" stroke-width="1.2"/>`
        + `<text x="${right + 6}" y="${top + 10}">${fmt(hi, dp)}</text><text x="${right + 6}" y="${top + PH}">${fmt(lo, dp)}</text>`
        + `<text x="${padL + 6}" y="${top + 13}"><tspan style="fill:var(--macd)">MACD ${MACD.fast},${MACD.slow}</tspan> <tspan style="fill:var(--signal)">시그널 ${MACD.signal}</tspan></text>`;
    }
  });
  svg += `<line id="cross" y1="${padT}" y2="${total}" stroke="var(--axis)" visibility="hidden"/></svg>`;
  box.querySelector("svg")?.remove();
  box.insertAdjacentHTML("beforeend", svg);

  const tip = $("#tip"), cross = $("#cross"), el = box.querySelector("svg");
  const show = i => {
    const c = cs[i], p = i ? cs[i - 1].c : c.o, r = (c.c / p - 1) * 100;
    tip.innerHTML = `${day(c.d)} · 시 ${fmt(c.o, dp)} 고 ${fmt(c.h, dp)} 저 ${fmt(c.l, dp)} 종 <b class="${r > 0 ? "up" : r < 0 ? "down" : ""}">${unit}${fmt(c.c, dp)} (${r > 0 ? "+" : ""}${fmt(r, 2)}%)</b> · 거래량 ${compact(c.v)}`
      + (hasInd ? "<br>" + lines.map(l => `<span class="ind" style="color:var(--${l.key})">${l.label} ${fmt(l.vs[i], dp)}</span>`).join("")
        + (band ? `<span class="ind" style="color:var(--bb)">BB 상 ${fmt(band[i]?.up, dp)} 중 ${fmt(band[i]?.mid, dp)} 하 ${fmt(band[i]?.lo, dp)}</span>` : "")
        + (osc.rsi ? `<span class="ind" style="color:var(--rsi)">RSI ${fmt(osc.rsi[i], 1)}</span>` : "")
        + (osc.macd ? `<span class="ind" style="color:var(--macd)">MACD ${fmt(osc.macd[i]?.m, dp + 1)} 시그널 ${fmt(osc.macd[i]?.s, dp + 1)} 히스토그램 ${fmt(osc.macd[i]?.h, dp + 1)}</span>` : "") : "");
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
  };
  el.onpointermove = e => {
    const r = el.getBoundingClientRect(), i = Math.floor(((e.clientX - r.left) * W / r.width - padL) / step);
    if (i >= 0 && i < n) show(i);
  };
  el.onpointerleave = () => { show(n - 1); cross.setAttribute("visibility", "hidden"); };
  show(n - 1); cross.setAttribute("visibility", "hidden");
}

// ---------------------------------------------------------------- 시작
(() => {
  try { const t = localStorage.getItem("div-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("div-theme", next); } catch {}
  };
  let t;
  addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => S.data && render(), 150); });
  const fromUrl = () => {
    const p = new URLSearchParams(location.search);
    if (p.get("code")) load(p); else $("#chart-card").hidden = true;
  };
  addEventListener("popstate", fromUrl);
  if (location.protocol === "file:") {
    $("#results").innerHTML = `<li class="error">이 파일을 직접 열면 조회할 수 없습니다. <code>python dividends_web.py</code>로 실행한 뒤 http://localhost:8000/chart 를 여세요.</li>`;
    return;
  }
  // 저장된 기간·지표 설정을 먼저 읽고 차트를 엶 (설정 파일은 작아 바로 옴).
  // 주소에 종목이 없으면 마지막으로 본 종목(최근 검색 맨 앞)을 엶
  loadSignals();
  Promise.all([loadSettings(), loadRecent()]).then(([, items]) => {
    if (!new URLSearchParams(location.search).get("code") && items[0]) pick(items[0], false);
    else fromUrl();
  });
})();
</script>
</body>
