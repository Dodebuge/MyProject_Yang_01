<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>종목 차트</title>
<!--
  종목 검색 + 일봉 차트. dividends_web.py가 /chart 로 이 파일을 제공합니다.
  검색은 /api/search?q= (국내 이름·종목번호, 미국 티커), 차트는 /api/chart?market=kr|us&code= (최근 약 1년 일봉).
  /chart?market=kr&code=005930 처럼 주소로 바로 열 수 있습니다.
-->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.04);
  --series-1: #2a78d6; --select: rgba(42,120,214,0.08); --bad: #d03b3b;
  --up: #e34948; --down: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
    --series-1: #3987e5; --select: rgba(57,135,229,0.14); --bad: #e66767;
    --up: #e66767; --down: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
  --series-1: #3987e5; --select: rgba(57,135,229,0.14); --bad: #e66767;
  --up: #e66767; --down: #3987e5;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
.wrap { max-width: 1160px; margin: 0 auto; padding: 24px 16px 48px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
.nav { display: flex; gap: 4px; margin: 0 0 10px -10px; font-size: 14px; }
.nav a { color: var(--ink-2); text-decoration: none; padding: 4px 10px; border-radius: 8px; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 650; background: var(--hover); }
.nav a.home { color: var(--muted); }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select, button, input {
  font: inherit; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--ink); cursor: pointer;
}
input { cursor: text; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--select); color: var(--series-1); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card + .card { margin-top: 12px; }
.card h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
.sub { color: var(--muted); font-size: 12px; margin: 0; }

.search { position: relative; }
.search input { width: 100%; padding: 10px 14px; font-size: 16px; }
.results { list-style: none; margin: 8px 0 0; padding: 0; max-height: 360px; overflow: auto; }
.results button { width: 100%; display: flex; gap: 10px; align-items: baseline; text-align: left; border: 0; border-radius: 8px; background: none; padding: 8px 10px; }
.results button:hover, .results button:focus-visible { background: var(--hover); }
.results .code { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.tag { font-size: 11px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; margin-left: auto; white-space: nowrap; }

.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 12px; }
.price { font-size: 32px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.chg { font-size: 15px; font-weight: 600; margin-left: 8px; }
.up { color: var(--up); } .down { color: var(--down); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 16px; margin-top: 12px; font-variant-numeric: tabular-nums; }
.stats div span { display: block; color: var(--muted); font-size: 12px; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .price { font-size: 26px; } }

#plot { position: relative; }
#plot svg { display: block; width: 100%; touch-action: pan-y; }
#plot text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; top: 4px; left: 8px; font-size: 12px; color: var(--ink-2); background: var(--surface); padding: 2px 6px; border-radius: 6px; pointer-events: none; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 32px 0; text-align: center; }
.error { border: 1px solid var(--bad); border-radius: 12px; padding: 16px; }
.loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 60px 0; color: var(--ink-2); }
.spinner { width: 20px; height: 20px; border: 2px solid var(--grid); border-top-color: var(--series-1); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.note { color: var(--muted); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <nav class="nav"><a href="./" class="home">KB OpenAPI</a><a href="heatmap">히트맵</a><a href="me">내정보</a><a href="chart" aria-current="page">차트</a></nav>
      <h1>종목 차트</h1>
    </div>
    <button id="theme" aria-label="테마 전환">◐</button>
  </header>

  <section class="card">
    <div class="search">
      <input id="q" type="search" placeholder="종목이름 · 종목번호 · 티커 (예: 삼성전자, 005930, AAPL)" autocomplete="off" aria-label="종목 검색" autofocus>
      <ul class="results" id="results"></ul>
    </div>
  </section>

  <section class="card" id="chart-card" hidden>
    <div id="chart-body"></div>
  </section>
  <p class="note">국내는 KB OpenAPI 상장 종목 목록(IVS10920)에서 이름·종목번호로, 미국은 티커로 찾습니다(나스닥·뉴욕·아멕스). 일봉은 국내 IVS11560, 미국 GSC10060(15분 지연)으로 최근 약 1년을 받습니다.</p>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 0) => n == null || isNaN(n) ? "—" : Number(n).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });
const compact = n => n >= 1e12 ? fmt(n / 1e12, 1) + "조" : n >= 1e8 ? fmt(n / 1e8, 0) + "억" : n >= 1e4 ? fmt(n / 1e4, 0) + "만" : fmt(n);
const day = d => `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)}`;
const PERIODS = { "1M": 21, "3M": 63, "6M": 126, "1Y": 9999 };
const S = { data: null, period: "6M", hover: null };

async function getJson(url) {
  const res = await fetch(url, { cache: "no-store" });
  const d = await res.json().catch(() => ({ error: `서버 응답이 JSON이 아닙니다 (HTTP ${res.status})` }));
  if (!res.ok || d.error) throw new Error(d.error || `HTTP ${res.status}`);
  return d;
}

// ---------------------------------------------------------------- 검색
let searchSeq = 0, timer;
$("#q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 250); });
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter") { clearTimeout(timer); search(true); }
  if (e.key === "ArrowDown") { e.preventDefault(); $("#results button")?.focus(); }
});
$("#results").addEventListener("keydown", e => {
  const bs = [...document.querySelectorAll("#results button")], i = bs.indexOf(document.activeElement);
  if (e.key === "ArrowDown") { e.preventDefault(); bs[i + 1]?.focus(); }
  if (e.key === "ArrowUp") { e.preventDefault(); (bs[i - 1] || $("#q")).focus(); }
});

async function search(openFirst = false) {
  const q = $("#q").value.trim(), seq = ++searchSeq;
  if (!q) { $("#results").innerHTML = ""; return; }
  $("#results").innerHTML = `<li class="sub" style="padding:8px 10px">검색 중…</li>`;
  try {
    const d = await getJson(`api/search?q=${encodeURIComponent(q)}`);
    if (seq !== searchSeq) return;  // 더 늦게 친 검색어의 결과만 보여 줌
    if (!d.results.length) { $("#results").innerHTML = `<li class="sub" style="padding:8px 10px">검색 결과가 없습니다.</li>`; return; }
    $("#results").innerHTML = d.results.map((s, i) => `<li><button data-i="${i}">
      <b>${esc(s.name)}</b><span class="code">${esc(s.code)}</span>
      <span class="tag">${s.market === "kr" ? "국내" : "미국" + (s.exchange ? " · " + esc(s.exchange) : "")}</span></button></li>`).join("");
    document.querySelectorAll("#results button").forEach(b => b.onclick = () => pick(d.results[b.dataset.i]));
    if (openFirst) pick(d.results[0]);
  } catch (err) {
    if (seq === searchSeq) $("#results").innerHTML = `<li class="error">${esc(err.message)}</li>`;
  }
}

// ---------------------------------------------------------------- 차트 조회
function pick(s, push = true) {
  $("#results").innerHTML = "";
  const params = new URLSearchParams({ market: s.market, code: s.code });
  if (s.exchange) params.set("exchange", s.exchange);
  if (push) history.pushState(null, "", `?${params}`);
  load(params);
}

let loadSeq = 0;
async function load(params) {
  const seq = ++loadSeq;
  $("#chart-card").hidden = false;
  $("#chart-body").innerHTML = `<div class="loading"><div class="spinner"></div>${esc(params.get("code"))} 일봉을 불러오고 있습니다.</div>`;
  try {
    const d = await getJson(`api/chart?${params}`);
    if (seq !== loadSeq) return;
    S.data = d; S.hover = null;
    document.title = `${d.name} 차트`;
    render();
  } catch (err) {
    if (seq === loadSeq) $("#chart-body").innerHTML = `<div class="error"><b>차트를 불러오지 못했습니다</b><br>${esc(err.message)}</div>`;
  }
}

function render() {
  const d = S.data, all = d.candles;
  if (!all.length) { $("#chart-body").innerHTML = `<div class="empty">일봉 데이터가 없습니다.</div>`; return; }
  const dp = d.currency === "USD" ? 2 : 0, unit = d.currency === "USD" ? "$" : "";
  const cs = all.slice(-PERIODS[S.period]);
  const last = all[all.length - 1], prev = all[all.length - 2];
  const chg = prev ? last.c - prev.c : 0, pct = prev ? chg / prev.c * 100 : 0;
  const ret = (last.c / cs[0].c - 1) * 100;
  const cls = v => v > 0 ? "up" : v < 0 ? "down" : "";
  const sign = v => v > 0 ? "+" : "";
  $("#chart-body").innerHTML = `
    <div class="head">
      <div>
        <h2>${esc(d.name)} <span class="sub">${esc(d.code)} · ${esc(d.exchange)} · ${day(last.d)} 기준</span></h2>
        <div><span class="price">${unit}${fmt(last.c, dp)}</span>
          <span class="chg ${cls(chg)}">${sign(chg)}${fmt(chg, dp)} (${sign(pct)}${fmt(pct, 2)}%)</span></div>
      </div>
      <div class="seg" role="group" aria-label="기간">${Object.keys(PERIODS).map(p => `<button data-p="${p}" aria-pressed="${p === S.period}">${p}</button>`).join("")}</div>
    </div>
    <div id="plot"><div class="tip" id="tip"></div></div>
    <div class="stats">
      <div><span>기간 수익률</span><b class="${cls(ret)}">${sign(ret)}${fmt(ret, 2)}%</b></div>
      <div><span>기간 최고</span>${unit}${fmt(Math.max(...cs.map(c => c.h)), dp)}</div>
      <div><span>기간 최저</span>${unit}${fmt(Math.min(...cs.map(c => c.l)), dp)}</div>
      <div><span>최근 거래대금</span>${unit}${compact(last.amt)}${d.currency === "USD" ? "" : "원"}</div>
    </div>`;
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { S.period = b.dataset.p; S.hover = null; render(); });
  draw(cs, dp, unit);
}

// ---------------------------------------------------------------- 그리기 (SVG 캔들 + 거래량)
function draw(cs, dp, unit) {
  const box = $("#plot"), W = box.clientWidth, H = Math.max(260, Math.min(420, W * 0.5));
  const padL = 8, padR = 64, padT = 28, volH = H * 0.18, gap = 8, priceH = H - padT - volH - gap - 20;
  const n = cs.length, step = (W - padL - padR) / n, bw = Math.max(1, Math.min(10, step * 0.7));
  const hi = Math.max(...cs.map(c => c.h)), lo = Math.min(...cs.map(c => c.l)), span = hi - lo || hi || 1;
  const y = v => padT + (hi - v) / span * priceH;
  const vmax = Math.max(...cs.map(c => c.v)) || 1;
  const vy = v => H - 20 - v / vmax * volH;
  const x = i => padL + step * (i + 0.5);
  const col = c => c.c > c.o ? "var(--up)" : c.c < c.o ? "var(--down)" : "var(--muted)";

  const ticks = Array.from({ length: 5 }, (_, i) => lo + span * i / 4);
  const months = cs.map((c, i) => [c, i]).filter(([c], i) => i && c.d.slice(4, 6) !== cs[i - 1].d.slice(4, 6));
  const every = Math.ceil(months.length / Math.max(1, Math.floor(W / 70)));
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="일봉 차트">`;
  svg += ticks.map(t => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>
    <text x="${W - padR + 6}" y="${y(t) + 4}">${fmt(t, dp)}</text>`).join("");
  svg += months.filter((_, k) => k % every === 0).map(([c, i]) => `<line x1="${x(i)}" x2="${x(i)}" y1="${padT}" y2="${H - 20}" stroke="var(--grid)" stroke-dasharray="2 3"/>
    <text x="${x(i)}" y="${H - 4}" text-anchor="middle">${c.d.slice(4, 6) === "01" ? c.d.slice(0, 4) : +c.d.slice(4, 6) + "월"}</text>`).join("");
  svg += cs.map((c, i) => `<line x1="${x(i)}" x2="${x(i)}" y1="${y(c.h)}" y2="${y(c.l)}" stroke="${col(c)}"/>
    <rect x="${x(i) - bw / 2}" y="${Math.min(y(c.o), y(c.c))}" width="${bw}" height="${Math.max(1, Math.abs(y(c.o) - y(c.c)))}" fill="${col(c)}"/>
    <rect x="${x(i) - bw / 2}" y="${vy(c.v)}" width="${bw}" height="${H - 20 - vy(c.v)}" fill="${col(c)}" opacity=".45"/>`).join("");
  const last = cs[n - 1];
  svg += `<line x1="${padL}" x2="${W - padR}" y1="${y(last.c)}" y2="${y(last.c)}" stroke="${col(last)}" stroke-dasharray="3 3"/>
    <rect x="${W - padR + 2}" y="${y(last.c) - 9}" width="${padR - 4}" height="18" rx="4" fill="${col(last)}"/>
    <text x="${W - padR + 6}" y="${y(last.c) + 4}" style="fill:#fff">${fmt(last.c, dp)}</text>`;
  svg += `<line id="cross" y1="${padT}" y2="${H - 20}" stroke="var(--axis)" visibility="hidden"/></svg>`;
  box.querySelector("svg")?.remove();
  box.insertAdjacentHTML("beforeend", svg);

  const tip = $("#tip"), cross = $("#cross"), el = box.querySelector("svg");
  const show = i => {
    const c = cs[i], p = i ? cs[i - 1].c : c.o, r = (c.c / p - 1) * 100;
    tip.innerHTML = `${day(c.d)} · 시 ${fmt(c.o, dp)} 고 ${fmt(c.h, dp)} 저 ${fmt(c.l, dp)} 종 <b class="${r > 0 ? "up" : r < 0 ? "down" : ""}">${unit}${fmt(c.c, dp)} (${r > 0 ? "+" : ""}${fmt(r, 2)}%)</b> · 거래량 ${compact(c.v)}`;
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
  };
  el.onpointermove = e => {
    const r = el.getBoundingClientRect(), i = Math.floor(((e.clientX - r.left) * W / r.width - padL) / step);
    if (i >= 0 && i < n) show(i);
  };
  el.onpointerleave = () => { show(n - 1); cross.setAttribute("visibility", "hidden"); };
  show(n - 1); cross.setAttribute("visibility", "hidden");
}

// ---------------------------------------------------------------- 시작
(() => {
  try { const t = localStorage.getItem("div-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("div-theme", next); } catch {}
  };
  let t;
  addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => S.data && render(), 150); });
  const fromUrl = () => {
    const p = new URLSearchParams(location.search);
    if (p.get("code")) load(p); else $("#chart-card").hidden = true;
  };
  addEventListener("popstate", fromUrl);
  if (location.protocol === "file:") {
    $("#results").innerHTML = `<li class="error">이 파일을 직접 열면 조회할 수 없습니다. <code>python dividends_web.py</code>로 실행한 뒤 http://localhost:8000/chart 를 여세요.</li>`;
    return;
  }
  fromUrl();
})();
</script>
</body>
</html>
