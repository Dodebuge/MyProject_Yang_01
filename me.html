<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내정보</title>
<!--
  내정보: 보유 종목 현황 + 배당 내역. dividends_web.py가 /me 로 이 파일을 제공하고,
  보유 종목은 /api/holdings (잔고 TR), 배당은 /api/dividends?year=YYYY (거래내역 TR).
  두 API 모두 서버가 하루(한국 날짜) 한 번만 KB를 조회해 kb.db에 저장하고, 같은 날은 저장된 값을 돌려줍니다.
-->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.04);
  --series-1: #2a78d6;   /* 국내 */
  --series-2: #eb6834;   /* 해외 */
  --select: rgba(42,120,214,0.08);
  --bad: #d03b3b;
  --up: #e34948; --down: #2a78d6; --flat: #e1e0d9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
    --series-1: #3987e5; --series-2: #d95926; --select: rgba(57,135,229,0.14); --bad: #e66767;
    --up: #e66767; --down: #3987e5; --flat: #383835;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
  --series-1: #3987e5; --series-2: #d95926; --select: rgba(57,135,229,0.14); --bad: #e66767;
    --up: #e66767; --down: #3987e5; --flat: #383835;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
.wrap { max-width: 1160px; margin: 0 auto; padding: 24px 16px 48px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
.status { color: var(--muted); font-size: 13px; min-height: 20px; }
.controls { display: flex; gap: 8px; align-items: center; }
select, button, input {
  font: inherit; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--ink); cursor: pointer;
}
button.primary { font-weight: 600; }
input { cursor: text; }
input.amount { width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
select.sm, input.sm, button.sm { padding: 3px 8px; font-size: 13px; }
button:disabled { opacity: .5; cursor: progress; }

.grid { display: grid; gap: 12px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.span-12 { grid-column: span 12; } .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; }
@media (max-width: 900px) { .span-7, .span-5 { grid-column: span 12; } }
.card h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
.card .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.card-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; flex-wrap: wrap; }

.tiles { display: grid; grid-template-columns: 2fr repeat(4, 1fr); gap: 12px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } .tiles .hero { grid-column: span 2; } }
.tiles.four { grid-template-columns: repeat(4, 1fr); }
.tiles.five { grid-template-columns: repeat(5, 1fr); }
@media (max-width: 900px) { .tiles.four, .tiles.five { grid-template-columns: repeat(2, 1fr); } }
#frac-plan { position: relative; }
#frac-plan [data-diff] { cursor: help; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 24px; font-weight: 650; margin-top: 2px; }
.tile.hero .value { font-size: 44px; line-height: 1.1; letter-spacing: -0.02em; }
.tile .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
.unit { font-size: .5em; font-weight: 500; margin-left: 2px; }

.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .col { cursor: pointer; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); white-space: nowrap; opacity: 0; transition: opacity .08s;
  font-variant-numeric: tabular-nums; z-index: 2;
}
.tip b { display: block; margin-bottom: 2px; }
.tip .row { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.tip .row span:first-child { color: var(--ink-2); }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

table.list { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.list th { text-align: right; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
table.list td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.list .l { text-align: left; }
table.list tbody tr:hover td { background: var(--hover); }
table.list tr.clickable { cursor: pointer; }
table.list tr.selected td { background: var(--select); }
table.list tfoot td { font-weight: 650; border-bottom: 0; border-top: 1px solid var(--axis); }
td.nm { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.neg { color: var(--bad); }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--ink-2); }
.scroll { overflow-x: auto; }
.show-sm { display: none; }
@media (max-width: 600px) {
  .hide-sm { display: none; }
  .show-sm { display: table-cell !important; }
  td.nm { max-width: 92px; }
  table.list th, table.list td { padding: 6px 4px; }
}

.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 150px) 1fr; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.bar-track { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar-fill { height: 16px; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 2px; }
.bar-fill.foreign { background: var(--series-2); }
.bar-val { font-variant-numeric: tabular-nums; white-space: nowrap; }

.empty, .notice { color: var(--muted); padding: 24px 0; text-align: center; }
.error { background: var(--surface); border: 1px solid var(--bad); border-radius: 12px; padding: 16px; }
.loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 80px 0; color: var(--ink-2); }
.spinner { width: 20px; height: 20px; border: 2px solid var(--grid); border-top-color: var(--series-1); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.note { color: var(--muted); font-size: 12px; margin-top: 10px; }

/* 보유 종목 */
.nav { display: flex; gap: 4px; margin: 0 0 10px -10px; font-size: 14px; }
.nav a { color: var(--ink-2); text-decoration: none; padding: 4px 10px; border-radius: 8px; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 650; background: var(--hover); }
.nav a.home { color: var(--muted); }
.section-head { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between; margin: 28px 0 12px; }
.section-head h2 { font-size: 17px; margin: 0; font-weight: 650; }
.up { color: var(--up); } .down { color: var(--down); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-radius: 0; padding: 6px 14px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); font-weight: 600; }
.scale { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.scale .steps { display: flex; gap: 2px; }
.scale .steps span { width: 24px; height: 12px; border-radius: 3px; }
.map { position: relative; width: 100%; }
.map svg { display: block; width: 100%; }
.map .leaf text { pointer-events: none; font-variant-numeric: tabular-nums; }
.map .leaf:hover rect { stroke: var(--ink); stroke-width: 2px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3-hierarchy@3"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <nav class="nav"><a href="./" class="home">KB OpenAPI</a><a href="heatmap">히트맵</a><a href="me" aria-current="page">내정보</a></nav>
      <h1>내정보</h1>
    </div>
    <div class="controls">
      <button id="kb-refresh" title="오늘 저장된 값을 건너뛰고 KB증권에서 보유 종목·정기 구매·배당 내역을 지금 다시 조회해 저장합니다">KB에서 다시 조회</button>
      <button id="theme" aria-label="테마 전환">◐</button>
    </div>
  </header>

  <section class="card" id="holdings">
    <div class="card-head">
      <div><h2>보유 종목 현황</h2><p class="sub" id="h-status"></p></div>
      <div class="controls">
        <div class="seg" id="h-color" role="group" aria-label="색 기준">
          <button data-v="change">오늘 등락률</button><button data-v="pl">수익률</button>
        </div>
        <button id="h-fetch">새로고침</button>
      </div>
    </div>
    <div id="h-body"></div>
  </section>

  <section class="card" id="recurring" style="margin-top:12px">
    <div class="card-head"><div><h2>정기 구매 내역</h2><p class="sub" id="r-status"></p></div></div>
    <div id="r-body"></div>
  </section>

  <div class="section-head">
    <div><h2>배당 내역</h2><div class="status" id="status"></div></div>
    <div class="controls">
      <select id="year" aria-label="연도"></select>
      <button class="primary" id="fetch">조회</button>
    </div>
  </div>
  <main id="app"></main>
</div>

<script>
// ---------------------------------------------------------------- 상태
const state = { data: null, month: null, loading: false };
const THIS_YEAR = new Date().getFullYear();
const KIND = { DIV: "배당금 입금", FTAX: "해외원천세 출금", KTAX: "배당세금추징 출금", REFUND: "해외원천세 환급 입금" };

// ---------------------------------------------------------------- 유틸
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 0) => n == null || isNaN(n) ? "—" : Number(n).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });
const won = n => `<span class="${n < 0 ? "neg" : ""}">${fmt(n)}</span>`;
const compact = n => {
  const a = Math.abs(n);
  if (a >= 1e8) return fmt(n / 1e8, 1) + "억";
  if (a >= 1e4) return fmt(n / 1e4, a >= 1e5 ? 0 : 1) + "만";
  return fmt(n);
};
const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
const isDiv = e => e.kind === KIND.DIV;
const isKR = e => e.currency === "KRW";
const niceMax = v => {
  if (v <= 0) return 1;
  const mag = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= v);
};

// ---------------------------------------------------------------- 집계
function aggregate(entries) {
  const months = Array.from({ length: 12 }, (_, i) => ({ m: i + 1, kr: 0, fx: 0, usd: 0, gross: 0, tax: 0, count: 0 }));
  for (const e of entries) {
    const b = months[e.month - 1];
    if (isDiv(e)) {
      b.count++;
      if (isKR(e)) b.kr += e.gross; else { b.fx += e.gross; b.usd += e.fx_amount; }
    }
    b.gross += e.gross; b.tax += e.tax;
  }
  months.forEach(b => b.net = b.gross - b.tax);

  const stocks = new Map();
  for (const e of entries.filter(isDiv)) {
    const s = stocks.get(e.name) || { name: e.name, gross: 0, count: 0, kr: isKR(e), months: new Set() };
    s.gross += e.gross; s.count++; s.months.add(e.month);
    stocks.set(e.name, s);
  }
  return { months, stocks: [...stocks.values()].sort((a, b) => b.gross - a.gross) };
}

// ---------------------------------------------------------------- 조회
// refresh: true면 서버가 저장된 오늘 값을 건너뛰고 KB에서 다시 조회합니다 (KB에서 다시 조회 버튼)
async function load(refresh = false) {
  const year = +$("#year").value;
  state.loading = true; state.month = null;
  $("#fetch").disabled = $("#year").disabled = true;
  $("#status").textContent = "";
  $("#app").innerHTML = `<div class="loading"><div class="spinner"></div>${refresh ? "KB증권에서 다시 조회하고 있습니다. " : ""}${year}년 거래내역을 불러오고 있습니다. KB 조회는 거래가 많으면 10~20초 걸립니다.</div>`;
  try {
    const res = await fetch(`api/dividends?year=${year}${refresh ? "&refresh=1" : ""}`, { cache: "no-store" });
    const json = await res.json();
    if (!res.ok || json.error) throw new Error(json.error || `HTTP ${res.status}`);
    state.data = json;
    if (json.year === THIS_YEAR) recentDiv = latestDividendMonth(json.entries);
    $("#status").textContent = `${json.start.slice(0, 4)}.${json.start.slice(4, 6)}.${json.start.slice(6)} – ${json.end.slice(0, 4)}.${json.end.slice(4, 6)}.${json.end.slice(6)} · 조회 ${json.fetchedAt}`;
    render();
  } catch (err) {
    state.data = null;
    $("#app").innerHTML = `<div class="error"><b>조회하지 못했습니다</b><br>${esc(err.message)}<div class="note">서버(dividends_web.py)가 실행 중인지, .env의 appKey/appSecret이 맞는지 확인하세요.</div></div>`;
  } finally {
    state.loading = false;
    $("#fetch").disabled = $("#year").disabled = false;
    renderPlan(planFs);  // 정기 구매 계획의 '최근 월 배당' 갱신
  }
}

// ---------------------------------------------------------------- 화면
function render() {
  const { entries, year } = state.data;
  const { months, stocks } = aggregate(entries);
  const divs = entries.filter(isDiv);
  const gross = sum(entries, e => e.gross), tax = sum(entries, e => e.tax), net = gross - tax;
  const lastMonth = year === THIS_YEAR ? new Date().getMonth() + 1 : 12;
  const shown = months.slice(0, Math.max(lastMonth, ...entries.map(e => e.month), 1));
  const paidMonths = shown.filter(b => b.count).length;
  const usd = sum(divs.filter(e => !isKR(e)), e => e.fx_amount);

  if (!entries.length) {
    $("#app").innerHTML = `<div class="card"><div class="empty">${year}년에 받은 배당이 없습니다.</div></div>`;
    return;
  }

  $("#app").innerHTML = `
  <div class="grid">
    <section class="card span-12">
      <div class="tiles">
        <div class="tile hero"><div class="label">${year}년 실수령 배당</div>
          <div class="value">${fmt(net)}<span class="unit">원</span></div>
          <div class="meta">세전 ${fmt(gross)}원 − 세금 ${fmt(tax)}원</div></div>
        <div class="tile"><div class="label">국내 배당 (세전)</div><div class="value">${compact(sum(divs.filter(isKR), e => e.gross))}<span class="unit">원</span></div>
          <div class="meta">ETF 분배금 포함</div></div>
        <div class="tile"><div class="label">해외 배당 (세전)</div><div class="value">$${fmt(usd, 2)}</div>
          <div class="meta">≈ ${fmt(sum(divs.filter(e => !isKR(e)), e => e.gross))}원</div></div>
        <div class="tile"><div class="label">월평균 실수령</div><div class="value">${compact(Math.round(net / shown.length))}<span class="unit">원</span></div>
          <div class="meta">${shown.length}개월 기준</div></div>
        <div class="tile"><div class="label">배당 입금</div><div class="value">${divs.length}<span class="unit">건</span></div>
          <div class="meta">${stocks.length}종목 · ${paidMonths}개월</div></div>
      </div>
    </section>

    <section class="card span-7">
      <div class="card-head">
        <div><h2>월별 세전 배당</h2><p class="sub">막대나 표의 행을 누르면 그 달의 상세 내역을 봅니다</p></div>
        <div class="legend"><span><i style="background:var(--series-1)"></i>국내</span><span><i style="background:var(--series-2)"></i>해외 (원화 환산)</span></div>
      </div>
      <div class="chart" id="month-chart"></div>
    </section>

    <section class="card span-5">
      <div class="card-head">
        <div><h2>종목별 세전 배당</h2><p class="sub">${stocks.length}종목 · 원화 기준</p></div>
        <div class="legend"><span><i style="background:var(--series-1)"></i>국내</span><span><i style="background:var(--series-2)"></i>해외</span></div>
      </div>
      <div class="bars">
        ${stocks.slice(0, 12).map(s => `<div class="bar-row" title="${esc(s.name)} · ${s.count}회 · ${[...s.months].sort((a, b) => a - b).join(", ")}월">
          <div class="nm">${esc(s.name)}</div>
          <div class="bar-track"><div class="bar-fill ${s.kr ? "" : "foreign"}" style="width:${(s.gross / stocks[0].gross * 72).toFixed(1)}%"></div><span class="bar-val">${compact(s.gross)}</span></div>
        </div>`).join("")}
      </div>
      ${stocks.length > 12 ? `<div class="note">외 ${stocks.length - 12}종목</div>` : ""}
    </section>

    <section class="card span-12">
      <h2>월별 합계</h2>
      <p class="sub">세금 = 해외 원천세 + 국내 원천징수·추징 − 해외 원천세 환급 · 해외 금액은 거래일 환율로 원화 환산</p>
      <div class="scroll"><table class="list">
        <thead><tr><th class="l">월</th><th class="hide-sm">건수</th><th class="hide-sm">국내 세전</th><th class="hide-sm">해외 세전 (USD)</th><th>세전 합계</th><th>세금</th><th>실수령</th></tr></thead>
        <tbody>${shown.map(b => `<tr class="clickable ${state.month === b.m ? "selected" : ""}" data-month="${b.m}">
          <td class="l">${b.m}월</td><td class="hide-sm">${b.count || ""}</td><td class="hide-sm">${b.kr ? fmt(b.kr) : ""}</td><td class="hide-sm">${b.usd ? "$" + fmt(b.usd, 2) : ""}</td>
          <td>${b.gross ? fmt(b.gross) : ""}</td><td>${b.tax ? won(b.tax) : ""}</td><td>${b.gross || b.tax ? won(b.net) : ""}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td class="l">합계</td><td class="hide-sm">${divs.length}</td><td class="hide-sm">${fmt(sum(shown, b => b.kr))}</td><td class="hide-sm">$${fmt(usd, 2)}</td>
          <td>${fmt(gross)}</td><td>${won(tax)}</td><td>${won(net)}</td></tr></tfoot>
      </table></div>
    </section>

    <section class="card span-12" id="detail"></section>
  </div>`;

  drawMonthChart(shown);
  renderDetail();
  document.querySelectorAll("tr[data-month]").forEach(tr => tr.onclick = () => selectMonth(+tr.dataset.month));
}

function selectMonth(m) {
  state.month = state.month === m ? null : m;
  document.querySelectorAll("tr[data-month]").forEach(tr => tr.classList.toggle("selected", +tr.dataset.month === state.month));
  document.querySelectorAll(".col").forEach(g => g.setAttribute("opacity", state.month && +g.dataset.month !== state.month ? 0.35 : 1));

}

        <td class="l"><span class="tag">${kindLabel(e.kind)}</span></td>
        <td class="hide-sm">${e.currency !== "KRW" ? `${fmt(e.fx_amount, 2)} ${esc(e.currency)}` : ""}</td>
        <td class="hide-sm">${e.fx_rate ? fmt(e.fx_rate, 1) : ""}</td>
        <td class="hide-sm">${e.gross ? fmt(e.gross) : ""}</td><td class="hide-sm">${e.tax ? won(e.tax) : ""}</td>
        <td class="show-sm">${won(e.gross - e.tax)}</td></tr>`).join("")}</tbody>
    </table></div>` : `<div class="empty">이 달에는 배당 내역이 없습니다.</div>`}`;
  $("#csv").onclick = () => downloadCsv(es, label);

}

function downloadCsv(es, label) {
  const cols = ["date", "name", "code", "kind", "currency", "fx_amount", "fx_rate", "gross", "tax", "net"];
  const q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const csv = "﻿" + [cols.join(","), ...es.map(e => cols.map(c => q(e[c])).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `dividends_${state.data.year}_${label}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------------------------------------------------------------- 월별 누적 막대
function drawMonthChart(months) {
  const host = $("#month-chart");
  if (!host) return;
  const W = host.clientWidth, H = 260, m = { t: 20, r: 8, b: 24, l: 44 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const ymax = niceMax(Math.max(...months.map(b => b.kr + b.fx), 1));
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => ymax * f);
  const band = iw / months.length, bw = Math.min(24, band * 0.6);
  const y = v => m.t + ih - (v / ymax) * ih;
  const GAP = 2;

  // 아래가 네모, 위쪽 끝만 4px 둥근 막대
  const seg = (x, top, bottom, round) => {
    const h = bottom - top;
    if (h <= 0) return "";
    const r = round ? Math.min(4, h, bw / 2) : 0;
    return `M${x},${bottom}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${bottom}Z`;
  };

  const cols = months.map((b, i) => {
    const x = m.l + i * band + (band - bw) / 2, base = m.t + ih;
    const krTop = y(b.kr), fxTop = y(b.kr + b.fx);
    const hasFx = b.fx > 0;
    const total = b.kr + b.fx;
    return `<g class="col" data-month="${b.m}" opacity="${state.month && state.month !== b.m ? 0.35 : 1}">
      <rect x="${m.l + i * band}" y="${m.t}" width="${band}" height="${ih}" fill="transparent"/>
      ${b.kr > 0 ? `<path d="${seg(x, krTop, base, !hasFx)}" fill="var(--series-1)"/>` : ""}
      ${hasFx ? `<path d="${seg(x, fxTop, b.kr > 0 ? krTop - GAP : base, true)}" fill="var(--series-2)"/>` : ""}
      ${total ? `<text x="${x + bw / 2}" y="${fxTop - 6}" text-anchor="middle" style="fill:var(--ink-2)">${compact(total)}</text>` : ""}
      <text x="${m.l + i * band + band / 2}" y="${H - 6}" text-anchor="middle">${b.m}월</text>
    </g>`;
  }).join("");

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="월별 세전 배당 누적 막대">
    ${ticks.map(t => `<line x1="${m.l}" x2="${m.l + iw}" y1="${y(t)}" y2="${y(t)}" stroke="${t ? "var(--grid)" : "var(--axis)"}"/>
      <text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${compact(t)}</text>`).join("")}
    ${cols}
  </svg><div class="tip"></div>`;

  const svg = $("svg", host), tip = $(".tip", host);
  svg.querySelectorAll(".col").forEach(g => {
    const b = months[+g.dataset.month - 1] || months.find(x => x.m === +g.dataset.month);
    g.addEventListener("click", () => selectMonth(b.m));
    g.addEventListener("pointermove", e => {
      tip.innerHTML = `<b>${b.m}월 · ${b.count}건</b>
        <div class="row"><span><i style="background:var(--series-1)"></i>국내</span><span>${fmt(b.kr)}원</span></div>
        <div class="row"><span><i style="background:var(--series-2)"></i>해외</span><span>${fmt(b.fx)}원${b.usd ? ` ($${fmt(b.usd, 2)})` : ""}</span></div>
        <div class="row"><span>세금</span><span>${fmt(b.tax)}원</span></div>
        <div class="row"><span>실수령</span><span><b style="display:inline;margin:0">${fmt(b.net)}원</b></span></div>`;
      tip.style.opacity = 1;
      const rect = host.getBoundingClientRect();
      const x = e.clientX - rect.left, w = tip.offsetWidth;
      tip.style.left = Math.min(Math.max(x + 12, 0), host.clientWidth - w) + "px";
      tip.style.top = Math.max(e.clientY - rect.top - tip.offsetHeight - 12, 0) + "px";
    });
    g.addEventListener("pointerleave", () => tip.style.opacity = 0);
  });
}

// ---------------------------------------------------------------- 보유 종목 (/api/holdings)
const hold = { data: null, color: "change" };
const HOLD_MAX = { change: 3, pl: 10 };  // 이 값 이상은 가장 진한 색
const pct = n => n == null || isNaN(n) ? "—" : `${n > 0 ? "+" : ""}${fmt(n, 2)}%`;
const updown = n => n > 0 ? "up" : n < 0 ? "down" : "";
const pctCell = n => `<span class="${updown(n)}">${pct(n)}</span>`;
// 등락률·수익률 -> 색. 0은 중립 회색, ±max에서 양 끝 색 (빨강 상승 / 파랑 하락, OKLab 섞기)
const tone = (v, max) => {
  const t = Math.min(Math.abs(v ?? 0) / max, 1);
  if (t < 0.03) return { fill: "var(--flat)", ink: "var(--ink)" };
  return { fill: `color-mix(in oklab, ${v > 0 ? "var(--up)" : "var(--down)"} ${Math.round(t * 100)}%, var(--flat))`, ink: t > 0.55 ? "#ffffff" : "var(--ink)" };
};
// 평가금액 가중 평균. 값이 없는 종목(null)은 뺍니다.
const weightedBy = (ss, f) => {
  const xs = ss.filter(x => f(x) != null), w = sum(xs, x => x.cap);
  return w ? sum(xs, x => f(x) * x.cap) / w : null;
};
// 총 수익률 = 평가손익 합 / 매입금액 합. 매입금액 = 평가금액 / (1 + 수익률). 결제 전(null) 종목은 뺍니다.
const plTotal = ss => {
  const xs = ss.filter(x => x.pl != null), cost = sum(xs, x => x.cap / (1 + x.pl / 100));
  return cost ? (sum(xs, x => x.cap) / cost - 1) * 100 : null;
};
const priceText = s => s.market === "미국" ? "$" + fmt(+s.price, 2) : fmt(+s.price) + "원";
const qtyText = q => fmt(q, Number.isInteger(q) ? 0 : 4);
const share = (n, total) => fmt(n / total * 100, 1) + "%";

  try {

// 소수점 구매 현황: 해외 잔고(SPQM2226)에서 소수점 거래 행(dcml_dl_f = "1")만 모은 값
function fractionalSection(ss) {
  const fs = ss.filter(s => s.frac_qty > 0).sort((a, b) => b.frac_krw - a.frac_krw);
  const head = `<div class="card-head" style="margin-top:28px"><div><h2>소수점 구매 현황</h2>
    <p class="sub">해외주식 소수점 거래로 산 수량만 · 같은 종목의 온주 보유분은 위 표에 합산돼 있습니다</p></div></div>`;
  if (!fs.length) return head + `<div class="empty">소수점으로 보유한 종목이 없습니다.</div><div id="frac-plan"></div>`;

  const usd = s => s.frac_qty * s.price;
  const plOf = (value, cost) => cost ? (value / cost - 1) * 100 : null;
  const cost = sum(fs, s => s.frac_cost_usd), value = sum(fs, usd), krw = sum(fs, s => s.frac_krw);
  return head + `
    <div class="tiles four">
      <div class="tile"><div class="label">소수점 보유 종목</div><div class="value">${fs.length}<span class="unit">종목</span></div>
        <div class="meta">${fs.filter(s => s.frac_qty < s.qty).length}종목은 온주도 함께 보유</div></div>
      <div class="tile"><div class="label">매입금액</div><div class="value">$${fmt(cost, 2)}</div><div class="meta">수량 × 평균 매입가</div></div>
      <div class="tile"><div class="label">평가금액</div><div class="value">$${fmt(value, 2)}</div><div class="meta">≈ ${fmt(krw)}원</div></div>
      <div class="tile"><div class="label">수익률</div><div class="value">${pctCell(plOf(value, cost))}</div><div class="meta">달러 기준</div></div>
    </div>
    <div class="scroll" style="margin-top:12px"><table class="list">
      <thead><tr><th class="l">종목</th><th>소수점 수량</th><th class="hide-sm">보유 중 비율</th><th class="hide-sm">평균 매입가</th><th class="hide-sm">현재가</th>
        <th class="hide-sm">매입금액</th><th>평가금액</th><th class="hide-sm">원화 평가</th><th>수익률</th></tr></thead>
      <tbody>${fs.map(s => `<tr>
        <td class="l nm" title="${esc(s.code)}">${esc(s.name)} <span class="tag">${esc(s.code)}</span></td>
        <td>${fmt(s.frac_qty, 6)}</td><td class="hide-sm">${fmt(s.frac_qty / s.qty * 100, 1)}%</td>
        <td class="hide-sm">$${fmt(s.frac_cost_usd / s.frac_qty, 2)}</td><td class="hide-sm">${priceText(s)}</td>
        <td class="hide-sm">$${fmt(s.frac_cost_usd, 2)}</td><td>$${fmt(usd(s), 2)}</td><td class="hide-sm">${fmt(s.frac_krw)}원</td>
        <td>${pctCell(plOf(usd(s), s.frac_cost_usd))}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td class="l">합계</td><td></td><td class="hide-sm"></td><td class="hide-sm"></td><td class="hide-sm"></td>
        <td class="hide-sm">$${fmt(cost, 2)}</td><td>$${fmt(value, 2)}</td><td class="hide-sm">${fmt(krw)}원</td><td>${pctCell(plOf(value, cost))}</td></tr></tfoot>
    </table></div>
    <div id="frac-plan"></div>`;
}

// ---------------------------------------------------------------- 소수점 정기 구매 계획
// 계획만 세우고 월 비용을 계산합니다. 실제 주문은 넣지 않으며, 설정은 이 브라우저(localStorage)에만 저장됩니다.
const PLAN_KEY = "frac-plan";
// ponytail: 월 비용은 평균 추정 (미국 거래일 연 252일, 연 52주). 휴장일과 달마다 다른 일수는 반영하지 않습니다.
const FREQ = { day: { label: "매일", perMonth: 252 / 12 }, week: { label: "매주", perMonth: 52 / 12 }, month: { label: "매월", perMonth: 1 } };
const plan = (() => { try { return JSON.parse(localStorage.getItem(PLAN_KEY)) || {}; } catch { return {}; } })();
const savePlan = () => { try { localStorage.setItem(PLAN_KEY, JSON.stringify(plan)); } catch {} };
const perMonth = p => p && FREQ[p.freq] && p.amount > 0 ? p.amount * FREQ[p.freq].perMonth : 0;
let planFs = [];        // 마지막으로 그린 소수점 보유 종목 (배당 조회가 끝나면 다시 그릴 때 사용)
let recentDiv = null;   // 올해 배당이 들어온 마지막 달 {m, gross, tax, net, count}

function latestDividendMonth(entries) {
  const paid = aggregate(entries).months.filter(b => b.count);
  return paid.length ? paid[paid.length - 1] : null;
}

function renderPlan(fs) {
  planFs = fs;
  const host = $("#frac-plan");
  if (!host) return;
  const names = new Map(fs.map(s => [s.code, s.name]));
  for (const [code, p] of Object.entries(plan)) if (!names.has(code)) names.set(code, p.name || code);
  const ps = Object.values(plan), total = sum(ps, perMonth);
  const count = f => ps.filter(p => p.freq === f && p.amount > 0).length;

  host.innerHTML = `
    <div class="card-head" style="margin-top:28px">
      <div><h2>정기 구매 계획</h2><p class="sub">종목마다 주기(매일·매주·매월)와 1회 금액을 정하면 월 비용을 계산합니다 · 실제 주문은 하지 않습니다</p></div>
      <div class="controls"><input id="plan-code" class="sm" placeholder="티커 (예: MSFT)" size="12" aria-label="추가할 종목 티커"><button id="plan-add" class="sm">종목 추가</button></div>
    </div>
    <div class="tiles five">
      <div class="tile" data-diff><div class="label">최근 월 배당${recentDiv ? ` (${recentDiv.m}월 실수령)` : ""}</div>
        <div class="value">${recentDiv ? `${fmt(recentDiv.net)}<span class="unit">원</span>` : state.loading ? `<span class="unit">조회 중</span>` : "—"}</div>
        <div class="meta">${recentDiv ? "올리면 월 비용과 비교" : state.loading ? "배당 내역을 불러오는 중" : "올해 받은 배당 없음"}</div></div>
      <div class="tile" data-diff><div class="label">월 예상 비용</div><div class="value">${fmt(total)}<span class="unit">원</span></div><div class="meta">평균 추정</div></div>
      <div class="tile"><div class="label">연 예상 비용</div><div class="value">${compact(total * 12)}<span class="unit">원</span></div><div class="meta">월 비용 × 12</div></div>
      <div class="tile"><div class="label">설정한 종목</div><div class="value">${ps.filter(p => perMonth(p)).length}<span class="unit">종목</span></div>
        <div class="meta">매일 ${count("day")} · 매주 ${count("week")} · 매월 ${count("month")}</div></div>
      <div class="tile"><div class="label">1회 합계</div><div class="value">${compact(sum(ps.filter(perMonth), p => p.amount))}<span class="unit">원</span></div><div class="meta">모든 종목이 같은 날 사면</div></div>
    </div>
    ${names.size ? `<div class="scroll" style="margin-top:12px"><table class="list">
      <thead><tr><th class="l">종목</th><th class="l">주기</th><th>1회 금액 (원)</th><th class="hide-sm">월 횟수</th><th>월 비용</th><th></th></tr></thead>
      <tbody>${[...names].map(([code, name]) => { const p = plan[code] || {}; return `<tr data-code="${esc(code)}">
        <td class="l nm" title="${esc(code)}">${esc(name)} <span class="tag">${esc(code)}</span></td>
        <td class="l"><select class="sm plan-freq" aria-label="${esc(name)} 주기"><option value="">설정 안 함</option>
          ${Object.entries(FREQ).map(([k, f]) => `<option value="${k}" ${p.freq === k ? "selected" : ""}>${f.label}</option>`).join("")}</select></td>
        <td><input class="sm amount plan-amount" type="number" min="0" step="1000" inputmode="numeric" value="${p.amount || ""}" placeholder="0" aria-label="${esc(name)} 1회 금액"></td>
        <td class="hide-sm">${FREQ[p.freq] ? fmt(FREQ[p.freq].perMonth, 1) + "회" : ""}</td>
        <td>${perMonth(p) ? fmt(perMonth(p)) + "원" : "—"}</td>
        <td>${names.has(code) && !fs.some(s => s.code === code) ? `<button class="sm plan-del" aria-label="${esc(name)} 삭제">삭제</button>` : ""}</td></tr>`; }).join("")}</tbody>
      <tfoot><tr><td class="l">합계</td><td></td><td></td><td class="hide-sm"></td><td>${fmt(total)}원</td><td></td></tr></tfoot>
    </table></div>` : `<div class="empty">소수점 보유 종목이 없습니다. 티커를 입력해 종목을 추가하세요.</div>`}
    <div class="note">월 횟수는 평균입니다: 매일 = 미국 거래일 기준 월 21회, 매주 = 월 4.3회, 매월 = 1회. 설정은 이 브라우저에만 저장되어 다른 기기에서는 보이지 않습니다.
      최근 월 배당은 올해 배당이 들어온 마지막 달의 실수령액(세후, 아래 배당 내역과 같은 값)입니다.</div>
    <div class="tip"></div>`;

  // 배당·월 비용 타일에 마우스를 올리면: 최근 월 배당으로 정기 구매할 때 남는 금액 또는 부족 금액
  const tip = $(".tip", host);
  const row = (k, v) => `<div class="row"><span>${k}</span><span>${v}</span></div>`;
  host.querySelectorAll("[data-diff]").forEach(el => {
    el.onpointermove = e => {
      if (!recentDiv) tip.innerHTML = `<b>최근 월 배당이 없습니다</b>${state.loading ? "배당 내역을 불러오는 중입니다." : "올해 받은 배당이 없어 비교할 수 없습니다."}`;
      else if (!total) tip.innerHTML = `<b>${recentDiv.m}월 배당 ${fmt(recentDiv.net)}원</b>정기 구매를 설정하면 남는·부족 금액을 계산합니다.`;
      else {
        const diff = recentDiv.net - total;
        tip.innerHTML = `<b>${recentDiv.m}월 배당으로 정기 구매하면</b>` +
          row("배당 실수령", fmt(recentDiv.net) + "원") + row("월 예상 비용", fmt(total) + "원") +
          row(diff >= 0 ? "남는 금액" : "부족 금액", `<b style="display:inline;margin:0" class="${diff < 0 ? "neg" : ""}">${fmt(Math.abs(diff))}원</b>`) +
          row("배당 충당률", fmt(recentDiv.net / total * 100, 0) + "%");
      }
      tip.style.opacity = 1;
      const r = host.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      tip.style.left = Math.max(0, Math.min(x + 14, host.clientWidth - tip.offsetWidth)) + "px";
      tip.style.top = Math.max(0, y - tip.offsetHeight - 12) + "px";
    };
    el.onpointerleave = () => tip.style.opacity = 0;
  });

  const update = tr => {
    const code = tr.dataset.code, freq = $(".plan-freq", tr).value, amount = Math.max(0, Math.round(+$(".plan-amount", tr).value || 0));
    const held = fs.some(s => s.code === code);
    if (!freq && !amount && held) delete plan[code];  // 보유 종목은 비우면 설정 삭제 (행은 계속 보임)
    else plan[code] = { name: names.get(code), freq, amount };
    savePlan(); renderPlan(fs);
  };
  host.querySelectorAll("tr[data-code]").forEach(tr => {
    $(".plan-freq", tr).onchange = () => update(tr);
    $(".plan-amount", tr).onchange = () => update(tr);
    const del = $(".plan-del", tr);
    if (del) del.onclick = () => { delete plan[tr.dataset.code]; savePlan(); renderPlan(fs); };
  });
  const add = () => {
    const code = $("#plan-code").value.trim().toUpperCase();
    if (!/^[A-Z0-9.]{1,12}$/.test(code)) { $("#plan-code").focus(); return; }
    if (!names.has(code)) { plan[code] = { name: code, freq: "", amount: 0 }; savePlan(); }
    renderPlan(fs);
  };
  $("#plan-add").onclick = add;
  $("#plan-code").onkeydown = e => { if (e.key === "Enter") add(); };
}

function drawHoldings(items, total, max) {
  const host = $("#h-map");
  if (!host) return;
  const W = host.clientWidth, H = Math.round(Math.min(Math.max(W * 0.4, 280), 480));
  const val = s => s[hold.color];
  const root = d3.hierarchy({ children: items.filter(s => s.cap > 0) }).sum(d => d.children ? 0 : d.cap).sort((a, b) => b.value - a.value);
  d3.treemap().size([W, H]).tile(d3.treemapSquarify.ratio(1.2)).paddingInner(2).round(true)(root);

  const nodes = root.leaves();
  const tiles = nodes.map((n, i) => {
    const s = n.data, w = n.x1 - n.x0, h = n.y1 - n.y0;
    const t = s.cash ? { fill: "var(--hover)", ink: "var(--ink)" } : tone(val(s), max);
    const big = w > 90 && h > 60, fits = w > 44 && h > 24;
    const size = big ? Math.min(20, Math.max(12, Math.sqrt(w * h) / 9)) : 11;
    const maxChars = Math.floor(w / (size * (/[가-힣]/.test(s.name) ? 1.0 : 0.62)));
    const name = s.name.length > maxChars ? s.name.slice(0, Math.max(maxChars - 1, 1)) + "…" : s.name;
    const cx = n.x0 + w / 2, cy = n.y0 + h / 2 - (big ? size * 0.35 : 0);
    const sub = s.cash ? share(s.cap, total) : `${share(s.cap, total)} · ${pct(val(s))}`;
    return `<g class="leaf" data-i="${i}"><rect x="${n.x0}" y="${n.y0}" width="${w}" height="${h}" rx="3" fill="${t.fill}"
        ${s.cash ? `stroke="var(--axis)" stroke-dasharray="4 3"` : ""}/>
      ${fits ? `<text x="${cx}" y="${big ? cy : cy + 4}" text-anchor="middle" font-size="${size}" font-weight="600" fill="${t.ink}">${esc(name)}</text>` : ""}
      ${big ? `<text x="${cx}" y="${cy + size + 4}" text-anchor="middle" font-size="${Math.max(11, size * 0.7)}" fill="${t.ink}" opacity=".9">${sub}</text>` : ""}</g>`;
  }).join("");
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="총자산 대비 종목·현금 비중 트리맵. 아래 표에 같은 내용이 있습니다.">${tiles}</svg><div class="tip"></div>`;

  const tip = $(".tip", host);
  const row = (k, v) => `<div class="row"><span>${k}</span><span>${v}</span></div>`;
  host.querySelectorAll(".leaf").forEach(g => {
    const s = nodes[+g.dataset.i].data;
    g.addEventListener("pointermove", e => {
      tip.innerHTML = s.cash
        ? `<b>현금</b>` + row("금액", fmt(s.cap) + "원") + row("비중", share(s.cap, total))
        : `<b>${esc(s.name)} <span style="color:var(--muted);font-weight:400">${esc(s.code)} · ${s.broker ?? "KB"} · ${s.market}</span></b>` +
          row("비중", share(s.cap, total)) + row("평가금액", fmt(s.cap) + "원") + row("섹터", esc(s.sector)) +
          row("보유 수량", qtyText(s.qty)) + row("현재가", priceText(s)) + row("오늘", pctCell(s.change)) + row("수익률", pctCell(s.pl));
      tip.style.opacity = 1;
      const r = host.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      tip.style.left = Math.max(0, x + 14 + tw > host.clientWidth ? x - tw - 14 : x + 14) + "px";
      tip.style.top = Math.max(0, y + 14 + th > host.clientHeight ? y - th - 14 : y + 14) + "px";
    });
    g.addEventListener("pointerleave", () => tip.style.opacity = 0);
  });
}

// ---------------------------------------------------------------- 시작
(() => {
  const sel = $("#year");
  for (let y = THIS_YEAR; y >= THIS_YEAR - 5; y--) sel.add(new Option(`${y}년`, y));
  $("#fetch").onclick = () => load();
  sel.onchange = () => load();

  const saved = (() => { try { return localStorage.getItem("div-theme"); } catch { return null; } })();
  if (saved) document.documentElement.dataset.theme = saved;
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("div-theme", next); } catch {}
  };

  $("#h-fetch").onclick = () => loadHoldings();
  $("#kb-refresh").onclick = async () => {
    const b = $("#kb-refresh");
    b.disabled = true;
    try { await Promise.all([loadHoldings(true), load(true), loadRecurring(true)]); } finally { b.disabled = false; }
  };
  try { const c = localStorage.getItem("hold-color"); if (c === "change" || c === "pl") hold.color = c; } catch {}
  const syncColor = () => document.querySelectorAll("#h-color button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === hold.color));
  document.querySelectorAll("#h-color button").forEach(b => b.onclick = () => {
    hold.color = b.dataset.v;
    try { localStorage.setItem("hold-color", hold.color); } catch {}
    syncColor(); renderHoldings();
  });
  syncColor();

  let t;
  addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => {
    state.data && drawMonthChart(aggregate(state.data.entries).months.slice(0, document.querySelectorAll("tr[data-month]").length));
    renderHoldings();
  }, 150); });

  if (location.protocol === "file:") {
    $("#app").innerHTML = `<div class="error">이 파일을 직접 열면 조회할 수 없습니다. <code>python dividends_web.py</code>로 실행한 뒤 http://localhost:8000/me 를 여세요.</div>`;
    return;
  }
  loadHoldings();
  loadRecurring();
  load();
})();
</script>
