# SLO 모니터 (kb-openapi-spring과 따로 도는 서버). 포트는 SLO_PORT (Spring 서버의 PORT와 겹치지 않게 이름을 나눔)
server.port=${SLO_PORT:9090}
spring.main.banner-mode=off

# Spring 서버와 같은 데이터 폴더를 읽기만 함 (이 모니터가 쓰는 곳은 slo.db 하나). .env의 NTFY_TOPIC·NTFY_SERVER를 씀
kb.data-dir=${KB_DATA_DIR:/home/jetson/yang/MyProject_Yang_01}
spring.config.import=optional:file:${kb.data-dir}/.env[.properties]

# 블랙박스 점검 대상 (Spring 서버)
slo.target=${SLO_TARGET:http://127.0.0.1:9080/api/settings}
