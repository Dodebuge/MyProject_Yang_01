# 포트 (환경변수 PORT로 바꿀 수 있음)
server.port=${PORT:8080}

# .env(appKey/appSecret)와 etf_snapshot.json·*.db를 두는 폴더. 실행 사용자에게 쓰기 권한 필요.
kb.data-dir=${KB_DATA_DIR:/opt/kb_openapi_sample}

# .env(KEY=값 줄)를 설정으로 읽음. 환경변수가 .env보다 우선 (Spring 설정 우선순위). 아래 kb.* 가 그 이름을 씀 (KbProperties)
spring.config.import=optional:file:${kb.data-dir}/.env[.properties]

kb.openapi.app-key=${KB_OPENAPI_APP_KEY:}
kb.openapi.app-secret=${KB_OPENAPI_APP_SECRET:}
kb.openapi.base-url=${KB_OPENAPI_BASE_URL:https://developer.kbsec.com:32484}
kb.openapi.ip-addr=${KB_OPENAPI_IP_ADDR:127.0.0.1}
kb.openapi.mac-addr=${KB_OPENAPI_MAC_ADDR:00:00:00:00:00:00}
# 토스 (없으면 내정보 토스 합산·자동매매·1분봉 토스 절반 꺼짐)
kb.toss.client-id=${TOSS_OPENAPI_CLIENT_ID:}
kb.toss.client-secret=${TOSS_OPENAPI_CLIENT_SECRET:}
kb.toss.base-url=${TOSS_OPENAPI_BASE_URL:https://openapi.tossinvest.com}
kb.toss.account-seq=${TOSS_OPENAPI_ACCOUNT_SEQ:}
# 보유 금액 4시간 기록 (MYSQL_HOST가 없으면 안 함)
kb.mysql.host=${MYSQL_HOST:}
kb.mysql.port=${MYSQL_PORT:3306}
kb.mysql.database=${MYSQL_DATABASE:kb_openapi}
kb.mysql.user=${MYSQL_USER:}
kb.mysql.password=${MYSQL_PASSWORD:}
# 시그널 알림 ntfy (NTFY_TOPIC이 없으면 브라우저 알림만), APP_URL: 알림을 누르면 열 차트 주소의 앞부분
kb.ntfy.topic=${NTFY_TOPIC:}
kb.ntfy.server=${NTFY_SERVER:https://ntfy.sh}
kb.ntfy.app-url=${APP_URL:}
# HTTPS: PEM 인증서·개인 키 경로 (상대 경로는 데이터 폴더 기준, deploy/make-cert.sh). 비우면 http
kb.ssl.cert=${SSL_CERT:}
kb.ssl.key=${SSL_KEY:}

# @Scheduled 작업 스레드 (장중 기록·알림·자동매매 5초·1분봉 수집이 서로 기다리지 않게)
spring.task.scheduling.pool.size=8
spring.task.scheduling.thread-name-prefix=kb-job-

# 화면(HTML)을 브라우저가 캐시하지 않게 (Python·Tomcat 버전과 같은 no-store).
# 없으면 Last-Modified만 보고 브라우저가 예전 홈·히트맵을 계속 보여 줄 수 있음 (새 메뉴·링크가 안 보임)
spring.web.resources.cache.cachecontrol.no-store=true
