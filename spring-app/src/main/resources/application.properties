# 포트 (환경변수 PORT로 바꿀 수 있음)
server.port=${PORT:8080}

# .env(appKey/appSecret)와 etf_snapshot.json을 두는 폴더. 실행 사용자에게 쓰기 권한 필요.
kb.data-dir=${KB_DATA_DIR:/opt/kb_openapi_sample}

# 화면(HTML)을 브라우저가 캐시하지 않게 (Python·Tomcat 버전과 같은 no-store).
# 없으면 Last-Modified만 보고 브라우저가 예전 홈·히트맵을 계속 보여 줄 수 있음 (새 메뉴·링크가 안 보임)
spring.web.resources.cache.cachecontrol.no-store=true
