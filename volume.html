<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>거래량 증가</title>
<!--
  코스닥·러셀 2000 거래량 증가 종목. dividends_web.py가 /volume 으로 제공합니다 (/volume?market=russell 이면 러셀 2000).
  러셀 2000은 같은 API의 russell-* 판(russell2000.csv 종목, 같은 시각은 뉴욕 장중 30분마다)을 씁니다. 보기 두 가지:
  - 같은 시각: 서버가 장중(평일 09:00~15:40) 10분마다 저장한 누적 거래량(kosdaq.db)을 전일·전주 같은 시각과 비교 (/api/kosdaq-intraday, KB 조회 없음)
  - 주간 평균: 이번 주와 전주의 하루 평균 거래량 (/api/kosdaq-volume, 약 1,700종목 일봉 조회라 30초 남짓).
    서버에 저장된 마지막 응답(?cached=1)을 먼저 그리고 새 응답으로 교체합니다.
-->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.04);
  --series-1: #2a78d6; --select: rgba(42,120,214,0.08); --bad: #d03b3b; --up: #e34948; --down: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
    --series-1: #3987e5; --select: rgba(57,135,229,0.14); --bad: #e66767; --up: #e66767; --down: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
  --series-1: #3987e5; --select: rgba(57,135,229,0.14); --bad: #e66767; --up: #e66767; --down: #3987e5;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
.wrap { max-width: 1160px; margin: 0 auto; padding: 24px 16px 48px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
.nav { display: flex; gap: 4px; margin: 0 0 10px -10px; font-size: 14px; }
.nav a { color: var(--ink-2); text-decoration: none; padding: 4px 10px; border-radius: 8px; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 650; background: var(--hover); }
.nav a.home { color: var(--muted); }
button, input, select { font: inherit; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); }
button, select { cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--select); color: var(--series-1); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.sub { color: var(--muted); font-size: 12px; margin: 0; }
.stale { color: var(--series-1); }
.stale.bad { color: var(--bad); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 4px 0 12px; }
.controls label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.controls input[type="number"] { width: 80px; padding: 4px 8px; }
.controls input[type="search"] { width: 180px; padding: 4px 10px; }
.controls select { padding: 4px 8px; }
.count { font-size: 16px; font-weight: 650; }
.table { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { color: var(--muted); font-weight: 500; font-size: 12px; text-align: left; padding: 6px; white-space: nowrap; }
th button { border: 0; padding: 0; background: none; color: inherit; font: inherit; }
th button[aria-pressed="true"] { color: var(--ink); font-weight: 650; }
td { padding: 7px 6px; border-top: 1px solid var(--grid); }
tbody tr { cursor: default; user-select: none; }  /* 더블클릭 때 글자가 선택되지 않게 */
tbody tr:hover { background: var(--hover); }
.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.code { color: var(--muted); font-size: 11px; margin-left: 4px; }
.up { color: var(--up); } .down { color: var(--down); }
.ratio { font-weight: 650; }
.days { color: var(--muted); font-size: 11px; }
/* 기술적 시그널 태그 (chart.html과 같은 모양): 매수 쪽 빨강, 매도 쪽 파랑 */
.sigs { margin-top: 2px; line-height: 1; }
.sig { display: inline-block; font-size: 11px; line-height: 17px; padding: 0 6px; border-radius: 999px; margin: 2px 4px 0 0; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.sig.buy { color: var(--up); border-color: color-mix(in srgb, var(--up) 45%, transparent); background: color-mix(in srgb, var(--up) 8%, transparent); }
.sig.sell { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, transparent); background: color-mix(in srgb, var(--down) 8%, transparent); }
@media (max-width: 640px) { .hide-sm { display: none; } }
.empty { color: var(--muted); padding: 32px 0; text-align: center; }
.error { border: 1px solid var(--bad); border-radius: 12px; padding: 16px; }
.loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 60px 0; color: var(--ink-2); }
.spinner { width: 20px; height: 20px; border: 2px solid var(--grid); border-top-color: var(--series-1); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.note { color: var(--muted); font-size: 12px; margin-top: 12px; }
.card + .card { margin-top: 12px; }
/* 시그널 알림 목록 */
.alerts-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.alerts-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
.alerts { list-style: none; margin: 8px 0 0; padding: 0; max-height: 232px; overflow: auto; }
.alerts li a { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; padding: 5px 6px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 13px; }
.alerts li a:hover { background: var(--hover); }
.alerts .when { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 78px; }
.alerts .mk { font-size: 11px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; }
.alerts .new { background: var(--select); }
#bell[aria-pressed="true"] { background: var(--select); color: var(--series-1); border-color: transparent; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <nav class="nav"><a href="./" class="home">KB OpenAPI</a><a href="heatmap">히트맵</a><a href="me">내정보</a><a href="chart">차트</a><a href="volume" aria-current="page">거래량</a></nav>
      <h1 id="title">거래량 증가</h1>
      <p class="sub" id="status">불러오는 중…</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <div class="seg" role="group" aria-label="시장" id="markets">
        <button data-market="kosdaq">코스닥</button><button data-market="russell">러셀 2000</button>
      </div>
      <div class="seg" role="group" aria-label="보기" id="views">
        <button data-view="intraday" title="장중 기록">같은 시각</button><button data-view="weekly">주간 평균</button>
      </div>
      <button id="reload">다시 조회</button><button id="bell" aria-pressed="false" title="새 상승 시그널을 브라우저 알림으로 받기">🔔 알림</button><button id="theme" aria-label="테마 전환">◐</button>
    </div>
  </header>

  <section class="card" id="alerts-card">
    <div class="alerts-head"><h2>시그널 알림</h2><span class="sub" id="alerts-status">불러오는 중…</span></div>
    <ul class="alerts" id="alerts"></ul>
  </section>

  <section class="card">
    <div class="controls">
      <span class="count" id="count"></span>
      <span id="when" hidden><select id="date" aria-label="날짜"></select> <select id="at" aria-label="시각"></select></span>
      <label><select id="basis" aria-label="비교 기준"><option value="prevRatio">전일 대비</option><option value="weekRatio">전주 대비</option></select>
        <span id="basis-weekly" hidden>전주 대비</span> <input id="min" type="number" value="10" step="5" aria-label="최소 증가율"> % 이상</label>
      <label><input id="rise" type="checkbox"> 주가 상승만</label>
      <label id="spac-box"><input id="spac" type="checkbox" checked> 스팩 제외</label>
      <input id="q" type="search" placeholder="종목 이름·번호" aria-label="종목 거르기">
    </div>
    <div id="body"><div class="loading"><div class="spinner"></div>불러오는 중…</div></div>
    <p class="note" id="note"></p>
  </section>
</div>
<script src="signals.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 0) => n == null || isNaN(n) ? "—" : Number(n).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });
const compact = n => n >= 1e12 ? fmt(n / 1e12, 1) + "조" : n >= 1e8 ? fmt(n / 1e8, 0) + "억" : n >= 1e4 ? fmt(n / 1e4, 0) + "만" : fmt(n);
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";
const pct = (n, d = 1) => n == null ? "—" : `${n > 0 ? "+" : ""}${fmt(n, d)}%`;
const md = d => d ? `${+d.slice(5, 7)}/${+d.slice(8)}` : "";
const usd = n => n >= 1e9 ? "$" + fmt(n / 1e9, 1) + "B" : n >= 1e6 ? "$" + fmt(n / 1e6, 0) + "M" : n >= 1e3 ? "$" + fmt(n / 1e3, 0) + "K" : "$" + fmt(n);

// 시장별 설정. 러셀 2000의 같은 시각 기록은 뉴욕 시간이라 한국 시간을 함께 보여 줌
const MARKETS = {
  kosdaq: { title: "코스닥 거래량 증가", api: "kosdaq", name: "코스닥", chart: "kr", dp: 0, money: compact, spac: true, local: "",
            every: "장중(평일 09:00~15:40) 10분마다", weekly: "코스닥 전 종목 일봉을 조회해 1분 가까이 걸립니다" },
  russell: { title: "러셀 2000 거래량 증가", api: "russell", name: "러셀 2000", chart: "us", dp: 2, money: usd, spac: false, local: "뉴욕 ",
             every: "뉴욕 장중(평일 10:00~16:30 뉴욕 시간, 한국 밤 23:00~05:30 무렵) 30분마다", weekly: "러셀 2000 종목(russell2000.csv)마다 일봉을 조회해 1분 남짓 걸립니다" },
};
const M = () => MARKETS[V.market];
// 현지 시각 "HH:MM" + UTC 오프셋(분) -> 한국 시각 "HH:MM"
const kst = (hm, offset) => {
  const m = ((+hm.slice(0, 2) * 60 + +hm.slice(3) - offset + 540) % 1440 + 1440) % 1440;
  return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
};
const when = (hm, offset) => M().local ? `${M().local}${hm} (한국 ${kst(hm, offset)})` : hm;

const SIG_NOTE = "기술적 시그널 태그(▲ 매수 쪽, ▼ 매도 쪽)와 종합 점수는 차트 페이지와 같은 규칙(이평선·MACD 교차는 최근 5거래일, RSI, 볼린저밴드, 이평선 배열)으로 주간 평균 조회 때 받은 약 1년 일봉 기준입니다. 투자 판단의 참고용입니다.";
// 보기별 열: [키, 제목, 숫자 열, 작은 화면에서 숨김, 칸 HTML]
const VIEWS = {
  intraday: {
    url: () => `api/${M().api}-intraday?${new URLSearchParams({ date: $("#date").value, at: $("#at").value })}`,
    note: () => `서버가 ${M().every} ${M().name} 종목의 누적 거래량을 저장합니다. 고른 시각까지의 거래량을 전일·전주(7일 전, 휴장이면 그 전 거래일)의 같은 시각과 비교합니다. 같은 시각 기록이 없으면 그 이전 마지막 기록과 비교합니다.${V.market === "russell" ? " KB 미국 시세는 15분 지연입니다." : ""} ${SIG_NOTE} 행을 더블클릭하면 차트가 열립니다.`,
    cols: [
      ["name", "종목", false, false, s => nameCell(s)],
      ["score", "시그널", true, false, s => scoreCell(s)],
      ["price", "현재가", true, true, s => fmt(s.price, M().dp)],
      ["change", "등락률", true, false, s => `<span class="${cls(s.change)}">${pct(s.change, 2)}</span>`],
      ["vlm", "거래량", true, false, s => fmt(s.vlm)],
      ["prevVlm", "전일 같은 시각", true, true, s => fmt(s.prevVlm)],
      ["prevRatio", "전일 대비", true, false, s => `<span class="ratio ${cls(s.prevRatio)}">${pct(s.prevRatio)}</span>`],
      ["weekVlm", "전주 같은 시각", true, true, s => fmt(s.weekVlm)],
      ["weekRatio", "전주 대비", true, false, s => `<span class="ratio ${cls(s.weekRatio)}">${pct(s.weekRatio)}</span>`],
      ["value", "거래대금", true, true, s => M().money(s.value)]],
  },
  weekly: {
    url: refresh => `api/${M().api}-volume${refresh ? "?refresh=1" : ""}`,
    note: () => `이번 주와 전주의 하루 평균 거래량을 비교합니다 (휴장일이 있거나 아직 끝나지 않은 주도 공정하게). 장중이면 오늘 거래량은 진행 중인 값입니다. KB에서 ${M().weekly}. ${SIG_NOTE} 행을 더블클릭하면 차트가 열립니다.`,
    cols: [
      ["name", "종목", false, false, s => nameCell(s)],
      ["score", "시그널", true, false, s => scoreCell(s)],
      ["price", "현재가", true, true, s => fmt(s.price, M().dp)],
      ["change", "등락률", true, false, s => `<span class="${cls(s.change)}">${pct(s.change, 2)}</span>`],
      ["prevAvg", "전주 하루 평균", true, true, s => `${fmt(s.prevAvg)} <span class="days">${s.prevDays}일</span>`],
      ["avg", "이번 주 하루 평균", true, false, s => `${fmt(s.avg)} <span class="days">${s.days}일</span>`],
      ["ratio", "증가율", true, false, s => `<span class="ratio ${cls(s.ratio)}">${pct(s.ratio)}</span>`],
      ["value", "거래대금", true, true, s => M().money(s.value)]],
  },
};
// ---------------------------------------------------------------- 기술적 시그널 태그 (signals.js, 차트 페이지와 같은 규칙)
// 주간 평균 응답의 종가(closes, 약 1년)로 계산합니다. 같은 시각 보기는 같은 시장의 주간 평균 응답에서 종목 코드로 찾아 씁니다.
function sigOf(s) {
  if (!("sig" in s)) {
    const n = s.closes?.length || 0, k = s.lastDays?.length || 0;
    s.sig = n ? signalsOf(s.closes.map((c, i) => ({ c, d: i >= n - k ? s.lastDays[i - (n - k)] : "" }))) : null;
    s.score = s.sig ? s.sig.reduce((a, g) => a + g.dir, 0) : null;
  }
  return s.sig;
}
function weeklyOf(s) {  // 이 종목의 주간 평균 응답 행 (시그널용 종가가 있는 쪽)
  if (V.view === "weekly") return s;
  const w = V.data[`${V.market}:weekly`];
  if (!w) return null;
  w.byCode ??= Object.fromEntries(w.stocks.map(x => [x.code, x]));
  return w.byCode[s.code] || null;
}
const nameCell = s => {
  const w = weeklyOf(s), list = w && sigOf(w);
  return `<b>${esc(s.name)}</b><span class="code">${esc(s.code)}</span>${list?.length ? `<div class="sigs">${sigBadges(list)}</div>` : ""}`;
};
const scoreCell = s => {
  const w = weeklyOf(s);
  if (!w) return `<span class="days">${V.weeklyLoading[V.market] ? "…" : "—"}</span>`;
  sigOf(w);
  return w.score == null ? "—" : `<span class="ratio ${cls(w.score)}">${w.score > 0 ? "+" : ""}${w.score}</span>`;
};
const val = (s, k) => k === "score" ? (weeklyOf(s) && (sigOf(weeklyOf(s)), weeklyOf(s).score)) : s[k];

// 같은 시각 보기에서도 시그널을 보이도록 주간 평균 응답을 뒤에서 받아 둠 (저장된 응답 먼저, 없으면 KB 조회)
async function ensureWeekly(market) {
  const k = `${market}:weekly`, api = MARKETS[market].api;
  if (V.data[k] || V.weeklyLoading[market]) return;
  V.weeklyLoading[market] = true;
  try {
    V.data[k] = await getJson(`api/${api}-volume?cached=1`).catch(() => getJson(`api/${api}-volume`));
  } catch { /* 시그널 없이 표만 보여 줌 */ }
  V.weeklyLoading[market] = false;
  if (V.market === market && V.view === "intraday") render();
}

const V = { weeklyLoading: {}, market: "kosdaq", view: "intraday", data: {}, sort: { intraday: "prevRatio", weekly: "ratio" }, desc: true, seq: 0 };
const key = () => `${V.market}:${V.view}`;  // 시장·보기별로 받은 응답
const basis = () => V.view === "weekly" ? "ratio" : $("#basis").value;

async function getJson(url) {
  const res = await fetch(url, { cache: "no-store" });
  const d = await res.json().catch(() => ({ error: `서버 응답이 JSON이 아닙니다 (HTTP ${res.status})` }));
  if (!res.ok || d.error) throw new Error(d.error || `HTTP ${res.status}`);
  return d;
}

function render() {
  const d = V.data[key()], view = VIEWS[V.view];
  if (!d) return;
  if (V.view === "intraday" && !d.stocks.length) {
    $("#count").textContent = "";
    $("#body").innerHTML = `<div class="empty">아직 기록이 없습니다. 서버가 켜져 있으면 ${esc(M().every)} 쌓입니다.<br>다음 기록 ${esc(d.nextTick.slice(0, 10))} ${esc(when(d.nextTick.slice(11), d.utcOffset))}</div>`;
    return;
  }
  const min = Number($("#min").value) || 0, q = $("#q").value.trim().toLowerCase(), b = basis(), k = V.sort[V.view];
  const rows = d.stocks
    .filter(s => s[b] != null && s[b] >= min)
    .filter(s => !($("#rise").checked && !(s.change > 0)) && !(M().spac && $("#spac").checked && s.name.includes("스팩")))
    .filter(s => !q || s.name.toLowerCase().includes(q) || s.code.toLowerCase().includes(q))
    .sort((x, y) => (k === "name" ? x.name.localeCompare(y.name, "ko") : (val(x, k) ?? -Infinity) - (val(y, k) ?? -Infinity)) * (V.desc ? -1 : 1));
  $("#count").textContent = `${fmt(rows.length)}종목`;
  $("#body").innerHTML = rows.length ? `<div class="table"><table>
    <thead><tr>${view.cols.map(([key, title, num, sm]) => `<th class="${num ? "num" : ""} ${sm ? "hide-sm" : ""}"><button data-k="${key}" aria-pressed="${key === k}">${title}${key === k ? (V.desc ? " ▼" : " ▲") : ""}</button></th>`).join("")}</tr></thead>
    <tbody>${rows.map(s => `<tr data-code="${esc(s.code)}" title="더블클릭하면 차트 열기">${view.cols.map(([, , num, sm, cell]) =>
      `<td class="${num ? "num" : ""} ${sm ? "hide-sm" : ""}">${cell(s)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
    : `<div class="empty">조건에 맞는 종목이 없습니다.</div>`;
}

function intradayStatus(d) {
  const next = `다음 기록 ${md(d.nextTick.slice(0, 10))} ${when(d.nextTick.slice(11), d.utcOffset)}`;
  if (!d.date) return `기록 없음 · ${next}`;
  const ref = (label, r) => r ? `${label} ${md(r.date)} ${r.at}` : `${label} 기록 없음`;
  return `${d.date} ${when(d.at, d.utcOffset)} 기록 · ${ref("전일", d.prev)} · ${ref("전주", d.week)} · ${next}`;
}

function fillWhen(d) {
  $("#date").innerHTML = d.dates.map(x => `<option value="${x}" ${x === d.date ? "selected" : ""}>${x}</option>`).join("");
  $("#at").innerHTML = d.slots.map(x => `<option value="${x}" ${x === d.at ? "selected" : ""}>${when(x, d.utcOffset)}</option>`).join("");
}

async function load(refresh) {
  const view = V.view, k = key(), seq = ++V.seq, status = $("#status");
  $("#reload").textContent = view === "weekly" ? "KB에서 다시 조회" : "다시 조회";
  $("#note").textContent = VIEWS[view].note();
  $("#title").textContent = document.title = M().title;
  $("#spac-box").hidden = !M().spac;
  if (view === "intraday" && !refresh && !V.data[k]) $("#date").innerHTML = $("#at").innerHTML = "";  // 다른 시장의 날짜·시각을 보내지 않게
  $("#when").hidden = $("#basis").hidden = view !== "intraday";
  $("#basis-weekly").hidden = view === "intraday";
  if (!V.data[k]) $("#body").innerHTML = `<div class="loading"><div class="spinner"></div>${view === "weekly" ? `KB에서 ${M().weekly}…` : "불러오는 중…"}</div>`;
  render();
  if (view === "weekly" && !refresh && !V.data[k]) {
    try { const d = await getJson(`api/${M().api}-volume?cached=1`); if (seq === V.seq) { V.data[k] = d; render(); } } catch { /* 저장된 응답이 없으면 기다림 */ }
  }
  if (view === "intraday") ensureWeekly(V.market);
  const prev = V.data[k];
  if (view === "weekly") status.innerHTML = prev ? `${esc(prev.fetchedAt)} 기준 · <span class="stale">KB에서 새로 조회하는 중…</span>` : "KB에서 조회하는 중…";
  $("#reload").disabled = true;
  try {
    const d = await getJson(VIEWS[view].url(refresh));
    if (seq !== V.seq) return;
    V.data[k] = d;
    if (view === "intraday") { fillWhen(d); $("#when").hidden = !d.dates.length; }
    status.textContent = view === "weekly" ? `${d.fetchedAt} 기준 · ${M().name} ${fmt(d.total)}종목${d.listed ? ` (목록 ${fmt(d.listed)}종목 중 조회된 종목)` : ""}` : intradayStatus(d);
    render();
  } catch (err) {
    if (seq !== V.seq) return;
    if (prev) status.innerHTML = `${esc(prev.fetchedAt || "")} · <span class="stale bad">새로 조회 실패: ${esc(err.message)}</span>`;
    else { status.textContent = ""; $("#body").innerHTML = `<div class="error">조회 실패: ${esc(err.message)}</div>`; }
  } finally { if (seq === V.seq) $("#reload").disabled = false; }
}

function setView(view, market = V.market) {
  V.view = view;
  V.market = market;
  V.desc = true;
  document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === view));
  document.querySelectorAll("#markets button").forEach(b => b.setAttribute("aria-pressed", b.dataset.market === market));
  try { localStorage.setItem("vol-view", view); } catch {}
  const url = new URL(location.href);
  if (market === "kosdaq") url.searchParams.delete("market"); else url.searchParams.set("market", market);
  url.searchParams.delete("view");
  history.replaceState(null, "", url);
  load(false);
}

$("#min").oninput = $("#q").oninput = $("#spac").onchange = $("#rise").onchange = render;
$("#basis").onchange = () => { V.sort.intraday = $("#basis").value; V.desc = true; render(); };
$("#date").onchange = () => { $("#at").value = ""; load(false); };
$("#at").onchange = () => load(false);
document.querySelectorAll("#views button").forEach(b => b.onclick = () => setView(b.dataset.view));
document.querySelectorAll("#markets button").forEach(b => b.onclick = () => setView(V.view, b.dataset.market));
$("#body").onclick = e => {
  const th = e.target.closest("th button");
  if (th) { const k = th.dataset.k; V.desc = k === V.sort[V.view] ? !V.desc : k !== "name"; V.sort[V.view] = k; return render(); }
};
// 행을 더블클릭하면 그 종목 차트로 이동 (한 번 클릭은 태그를 읽거나 글자를 고를 때 실수로 넘어가지 않게)
$("#body").ondblclick = e => {
  const tr = e.target.closest("tbody tr");
  if (tr) location.href = `chart?market=${M().chart}&code=${encodeURIComponent(tr.dataset.code)}`;
};
$("#reload").onclick = () => load(true);

// ---------------------------------------------------------------- 시그널 알림
// 서버(alerts.py / Alerts.java)가 코스닥·러셀 2000 주간 평균 증가율 top 30을 장중 5분마다 확인해 새 상승 시그널을 기록합니다.
// 이 페이지는 1분마다 /api/alerts를 읽어 목록을 갱신하고, 🔔 알림을 켜 두면 새 알림을 브라우저 알림으로 띄웁니다.
// 브라우저 알림은 https 주소나 localhost에서만 쓸 수 있습니다 (휴대폰은 ntfy 앱, 서버 .env의 NTFY_TOPIC).
const AL = { last: -1, items: [], fresh: new Set(), on: false };
const MK = { kosdaq: "코스닥", russell: "러셀 2000" };
const canNotify = () => "Notification" in window && window.isSecureContext;
const alertTitle = a => `[${MK[a.market] || a.market}] ${a.name} ▲ ${a.text}`;
const alertDay = a => a.d ? ` ${+a.d.slice(4, 6)}/${+a.d.slice(6)}` : "";

async function pollAlerts() {
  let d;
  try { d = await getJson(`api/alerts${AL.last >= 0 ? `?since=${AL.last}` : ""}`); }
  catch (err) { $("#alerts-status").textContent = `알림을 읽지 못했습니다: ${err.message}`; return; }
  if (AL.last >= 0) {  // 첫 조회(지난 알림)는 띄우지 않고 목록에만
    d.alerts.forEach(a => AL.fresh.add(a.id));
    if (AL.on && canNotify() && Notification.permission === "granted") {
      for (const a of [...d.alerts].reverse()) {
        const n = new Notification(alertTitle(a), { body: `${a.name} (${a.code}) ${a.text}${alertDay(a)} · 주간 거래량 ${a.ratio > 0 ? "+" : ""}${fmt(a.ratio, 1)}%`, tag: `alert-${a.id}` });
        n.onclick = () => { window.focus(); location.href = `chart?${a.chart}`; };
      }
    }
  }
  AL.items = [...d.alerts, ...AL.items.filter(x => !d.alerts.some(a => a.id === x.id))].slice(0, 100);
  AL.last = Math.max(AL.last, 0, ...d.alerts.map(a => a.id));
  const mk = Object.values(d.markets).map(m => `${m.name} ${m.status}${m.checkedAt ? ` ${m.checkedAt.slice(11)}` : ""}`).join(" · ");
  $("#alerts-status").textContent = `증가율 top ${d.top}의 새 상승 시그널 · 장중 ${d.every}분마다 · ${mk} · 휴대폰(ntfy) ${d.ntfy ? "켜짐" : "꺼짐"}`;
  $("#alerts").innerHTML = AL.items.length ? AL.items.map(a => `<li><a href="chart?${esc(a.chart)}" class="${AL.fresh.has(a.id) ? "new" : ""}" title="차트 열기">
      <span class="when">${esc(a.at.slice(5).replace("-", "/"))}</span><span class="mk">${esc(MK[a.market] || a.market)}</span>
      <b>${esc(a.name)}</b><span class="code">${esc(a.code)}</span><span class="sig buy">▲ ${esc(a.text)}${alertDay(a)}</span>
      <span class="days">주간 거래량 ${a.ratio > 0 ? "+" : ""}${fmt(a.ratio, 1)}%</span></a></li>`).join("")
    : `<li class="sub" style="padding:6px">아직 알림이 없습니다.</li>`;
}

function setBell(on) {
  AL.on = on;
  $("#bell").setAttribute("aria-pressed", on);
  try { localStorage.setItem("vol-alerts", on ? "on" : "off"); } catch {}
}
$("#bell").onclick = async () => {
  if (AL.on) return setBell(false);
  if (!canNotify()) return alert("브라우저 알림은 https 주소나 localhost에서만 쓸 수 있습니다.\n알림 목록은 이 화면에서 계속 갱신되고, 휴대폰은 ntfy 앱으로 받을 수 있습니다 (README '시그널 알림').");
  if (await Notification.requestPermission() !== "granted") return alert("브라우저에서 알림 권한을 허용해야 합니다.");
  setBell(true);
};
try { setBell(localStorage.getItem("vol-alerts") === "on" && canNotify() && Notification.permission === "granted"); } catch {}
pollAlerts();
setInterval(pollAlerts, 60000);
try { const t = localStorage.getItem("div-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("div-theme", next); } catch {}
};
// 주소의 ?market=russell&view=weekly 가 있으면 그 시장·보기로 열고, 없으면 마지막으로 본 보기
const params = new URLSearchParams(location.search);
let saved = params.get("view");
try { if (!(saved in VIEWS)) saved = localStorage.getItem("vol-view"); } catch {}
setView(saved in VIEWS ? saved : "intraday", params.get("market") in MARKETS ? params.get("market") : "kosdaq");
</script>
</body>
</html>
